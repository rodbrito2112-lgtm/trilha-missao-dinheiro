<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A7D">
<meta name="description" content="Jogo de educação financeira para crianças, adolescentes e famílias.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="arte/icons/favicon-32.png">
<link rel="apple-touch-icon" href="arte/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missão Dinheiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Trilha Missão Dinheiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout v0.2: abas (Trilha, Banco, Loja, Mutirão) + painel lateral da semana; lição em tela cheia. Identidade única clara, cores do Manual da Marca. */
:root{
  /* Tokens do Manual da Marca Única v1.1: marinho #09274D, amarelo #FFC12E, turquesa #12B8BB (acentos rosa #F35A8B e roxo #7966D8).
     --teal é um tom mais escuro do turquesa, para textos com contraste AA; --turq é o turquesa da marca, para preenchimentos. */
  --navy:#09274D; --yellow:#FFC12E; --yellow-d:#D9A01C; --teal:#0B7A7D; --turq:#12B8BB; --rosa:#F35A8B; --roxo:#7966D8; --cream:#FFF8EC;
  --white:#FFFFFF; --border:#EADFC9; --muted:#3D4F66; --aqua:#E6F7F7;
  --coral:#C8462F; --coral-bg:#FDECE7; --locked:#E7DFCF; --locked-d:#CDBFA6; --night:#0E2547;
  --display:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--cream);color:var(--navy)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
/* Movimento: segue o pedido do sistema (menos movimento), mas o jogador pode ligar ou desligar no painel lateral */
.num{font-variant-numeric:tabular-nums}

/* HUD e abas */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:2px solid var(--border)}
.hud-in,.tabs-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-in{padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.05;margin-right:auto}
.brand img{height:38px}
.brand small{display:block;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:none;border:0;padding:4px}
.stat svg{width:22px;height:22px}
.stat small{font-weight:700;font-size:11px;color:var(--muted)}
.chip{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:800;font-size:13px}
.tabs-in{gap:6px;padding-block:0 10px;overflow-x:auto}
.tab{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:800;font-size:14px;white-space:nowrap}
.tab.on{background:var(--navy);border-color:var(--navy);color:var(--white)}

/* Página */
.page{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding-block:24px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.page{grid-template-columns:minmax(0,1fr)}}
.tab.week{border-style:dashed;color:var(--teal);margin-left:auto}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:18px;min-width:0}
.card h3{font-size:18px;font-weight:800;margin-bottom:4px}
.card h4{font-size:15px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.bar{height:14px;background:var(--locked);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .5s}
.row-sb{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.cast{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);width:64px;text-align:center}
.note{font-size:12px;color:var(--muted);border-top:1px dashed var(--border);padding-top:10px;margin-top:12px}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--locked);display:block}
.dots i.on{background:var(--teal)}
.test{border-style:dashed;background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sbtn{border:2px solid var(--border);border-bottom-width:4px;background:var(--cream);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.sbtn:active{transform:translateY(2px)}
.sbtn.pri{background:var(--yellow);border-color:var(--yellow-d)}
.sbtn.dark{background:var(--navy);border-color:#000;color:var(--white)}
.sbtn[disabled]{opacity:.45;cursor:default}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
.pot{border-radius:16px;padding:12px;background:var(--pc);color:var(--pk)}
.pot small{display:block;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.pot b{display:block;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.pot span{font-size:12px;opacity:.85}
.prod{border:2px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.prod .val{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.lot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:8px;font-size:14px}
.lot b{font-variant-numeric:tabular-nums}
.lot .grow{flex:1 1 160px}
table.calc{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:8px}
table.calc td,table.calc th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left}
table.calc tr.on td{font-weight:700;color:var(--teal)}
.rule-row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.rule-row b{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);border-bottom-width:4px;background:var(--cream);font-weight:700;font-size:18px;line-height:1}
select{font:inherit;border:2px solid var(--border);border-radius:12px;padding:6px 10px;background:var(--white);color:var(--navy)}

/* Loja */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.item .top{display:flex;align-items:center;gap:12px}
.item .kind{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.item h4{font-size:16px}
.item .price{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.item .tagline{font-size:13px;color:var(--muted)}
.item .warn{font-size:13px;color:var(--coral);font-weight:600}
.item .cost{font-size:13px;background:var(--aqua);border-radius:10px;padding:6px 10px;color:var(--teal)}
.item.owned{border-color:var(--teal)}
.icon-box{width:56px;height:56px;border-radius:14px;background:var(--cream);display:grid;place-items:center;flex:none;overflow:hidden}

/* Trilha */
.trail{display:flex;flex-direction:column;gap:28px;min-width:0;border-radius:24px;transition:background .3s}
.trail.night{background:var(--night);padding:16px}
.trail.night .node-label{color:#CFE3F5}
.unit-head{background:var(--u);color:var(--ink);border-radius:20px;padding:16px 20px;box-shadow:0 5px 0 color-mix(in srgb,var(--u) 72%,#000)}
.unit-head .eb{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:22px;font-weight:800;margin-top:2px}
.unit-head .selo{float:right;font-size:12px;font-weight:800;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;margin-left:8px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;z-index:1;width:76px;height:70px;border-radius:50%;border:0;background:var(--u);color:var(--ink);display:grid;place-items:center;box-shadow:0 7px 0 color-mix(in srgb,var(--u) 70%,#000);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--u) 70%,#000)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--locked);color:var(--locked-d);box-shadow:0 7px 0 var(--locked-d)}
.node-label{font-family:var(--display);font-weight:800;font-size:13px;margin-top:12px;color:var(--muted);max-width:150px;text-align:center;line-height:1.2}
.node.current{animation:bob 1.6s ease-in-out infinite}
.node-wrap.current::before{pointer-events:none;z-index:0;content:"";position:absolute;top:-8px;width:92px;height:86px;border-radius:50%;border:5px solid color-mix(in srgb,var(--u) 45%,transparent)}
.start-tag{position:absolute;top:-44px;background:var(--white);border:2px solid var(--border);border-radius:12px;padding:4px 12px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--teal);letter-spacing:.06em;white-space:nowrap}
.start-tag[data-act],.node-label[data-act]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--white);border-right:2px solid var(--border);border-bottom:2px solid var(--border);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Avatares */
.av{position:relative;flex:none;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;border:3px solid var(--white);box-shadow:0 0 0 2px var(--border)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--white);border-radius:50%}
.av span{font-size:calc(var(--s) * .42)}
.av.cheer{animation:cheer .6s ease 2}
.av.oops{animation:shake .4s ease}
@keyframes cheer{40%{transform:translateY(-8px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* Acessórios da Loja: selos ao lado do Tiko */
.acc{position:absolute;right:-6%;bottom:-6%;display:flex;gap:2px;z-index:2}
.acc i{width:clamp(18px,calc(var(--s,60px) * .36),40px);aspect-ratio:1;border-radius:50%;background:var(--white);border:2px solid var(--border);display:grid;place-items:center;padding:2px}
.acc svg{width:100%;height:100%}
.sprite .acc{right:0;bottom:6%}.sprite .acc i{width:34px}

/* Personagens de corpo inteiro: entram, respiram, pulam no acerto e inclinam no erro */
.sprite{position:relative;flex:none;height:var(--h);display:inline-flex;align-items:flex-end;transform-origin:50% 100%;animation:entra .7s cubic-bezier(.3,1.7,.5,1) both;padding-bottom:10px}
.sprite img{position:relative;z-index:1;height:calc(100% - 10px);width:auto;display:block;transform-origin:50% 100%;animation:vida 4.6s ease-in-out .7s infinite;animation-delay:var(--d,.7s);filter:drop-shadow(0 6px 4px rgba(9,39,77,.14))}
/* sombra no chão, que encolhe quando o personagem sobe */
.sprite::after{content:"";position:absolute;left:18%;right:18%;bottom:2px;height:12px;border-radius:50%;background:rgba(9,39,77,.16);animation:sombra 4.6s ease-in-out .7s infinite;animation-delay:var(--d,.7s)}
@keyframes vida{0%,100%{transform:translateY(0) rotate(-1.5deg)}20%{transform:translateY(-14px) rotate(1.5deg)}40%{transform:translateY(0) rotate(-1.5deg)}
  56%{transform:translateY(-10px) rotate(1deg)}66%{transform:translateY(0) scale(1.05,.94)}74%{transform:translateY(-30px) scale(.95,1.06) rotate(-3deg)}
  84%{transform:translateY(0) scale(1.06,.94)}92%{transform:translateY(-6px) scale(1)}}
@keyframes sombra{0%,40%,66%,84%,100%{transform:scale(1);opacity:1}20%,56%{transform:scale(.8);opacity:.7}74%{transform:scale(.6);opacity:.45}}
.sprite.sem-img{width:calc(var(--h) * .45);border-radius:999px 999px 20px 20px;background:var(--locked)}
.sprite.jump{animation:pula .75s cubic-bezier(.3,1.6,.5,1)}
.sprite.tilt{animation:inclina .7s ease}
.sprite.pop{animation:entra .6s cubic-bezier(.3,1.6,.5,1) both,pula .8s cubic-bezier(.3,1.6,.5,1) .6s}
@keyframes entra{from{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:none}}
@keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
@keyframes pula{0%{transform:none}18%{transform:scale(1.07,.9)}48%{transform:translateY(-26px) scale(.95,1.06) rotate(-3deg)}78%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes inclina{25%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
body.calmo .sprite{animation-duration:.35s}
body.calmo .sprite.jump,body.calmo .sprite.pop{animation:pula-c .5s ease}
@keyframes pula-c{40%{transform:translateY(-8px)}}
body.calmo .sprite img{animation:flutua-c 4s ease-in-out infinite}
body.calmo .sprite::after{animation:none}
@keyframes flutua-c{50%{transform:translateY(-6px)}}
@keyframes entra{from{opacity:0;transform:translateY(60px) scale(.6) rotate(-8deg)}60%{opacity:1;transform:translateY(-12px) scale(1.06) rotate(3deg)}to{opacity:1;transform:none}}
body.sem-anim *,body.sem-anim *::after{animation:none!important;transition:none!important}
/* Palco da lição: quem fala, o objeto do objetivo e o balão */
.palco{display:flex;align-items:flex-end;gap:12px}
.palco .bubble{flex:1}
.palco .prop{position:absolute;width:44px;height:44px;left:calc(100% - 22px);top:4%;animation:flutua 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(9,39,77,.18))}
.palco .prop svg{width:100%;height:100%}
.palco .quem{position:relative;flex:none}
@keyframes flutua{50%{transform:translateY(-8px) rotate(6deg)}}
.carinhas{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.carinha{flex:1 1 48px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:28px;line-height:1;background:var(--white);border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;padding:8px 4px}
.carinha small{font-size:12px;font-weight:700;color:var(--muted)}
.carinha.sel{border-color:var(--turq);background:var(--aqua)}
.palco .prop.pop{animation:prop-pop .7s cubic-bezier(.3,1.6,.5,1)}
.reacao{position:absolute;z-index:3;top:-6%;left:-14%;width:86px;height:86px;border-radius:50%;border:4px solid var(--white);box-shadow:0 0 0 3px var(--turq),0 8px 14px rgba(9,39,77,.18);overflow:hidden;background:var(--white);animation:reage .55s cubic-bezier(.3,1.8,.5,1) both}
.reacao.no{box-shadow:0 0 0 3px var(--yellow),0 8px 14px rgba(9,39,77,.18)}
.reacao img{width:100%;height:100%;object-fit:cover}
@keyframes reage{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:none}}
@media (max-width:520px){.reacao{width:64px;height:64px;left:-8%}}
@keyframes prop-pop{40%{transform:scale(1.45) rotate(-12deg)}}
body.calmo .palco .prop{width:30px;height:30px;animation:none;opacity:.85}
@media (max-width:520px){.palco .sprite{--h:200px!important}.palco .prop{width:38px;height:38px}}
/* Brilhos e moedas */
.fx{position:fixed;z-index:60;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;animation:voa 1.1s cubic-bezier(.2,.8,.4,1) both}
.fx svg{width:100%;height:100%}
@keyframes voa{0%{opacity:0;transform:scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg)}}
/* Cena do resultado */
.cena{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:150px}
.cofre{position:relative;width:96px;height:120px;display:flex;align-items:flex-end}
.cofre>svg{width:96px;height:84px;animation:sacode .4s ease 1.4s 2}
.cofre .cai{position:absolute;top:0;width:24px;height:24px;opacity:0;animation:cai .7s cubic-bezier(.5,0,.8,.6) both}
.cofre .cai svg{width:100%;height:100%}
@keyframes cai{0%{opacity:0;transform:translateY(-50px)}20%{opacity:1}85%{opacity:1;transform:translateY(42px) scale(.9)}100%{opacity:0;transform:translateY(48px) scale(.4)}}
@keyframes sacode{50%{transform:rotate(-5deg) scale(1.05)}}
/* Personagens ao lado da trilha, como no mapa */
.trail section{position:relative}
.amigo{position:absolute;top:190px;z-index:1;pointer-events:none}
.amigo.dir{right:2%}.amigo.esq{left:2%}
.amigo .sprite img{height:auto;width:auto;max-height:calc(var(--h) - 10px);max-width:132px}
.amigo .sprite{height:auto}
.amigo .fala{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--white);border:2px solid var(--border);border-radius:12px;padding:3px 10px;font-family:var(--display);font-weight:800;font-size:12px;white-space:nowrap;color:var(--navy);margin-bottom:6px}
/* No celular não cabe ao lado do caminho: o personagem aparece grande, centralizado, depois dos nós de cada objetivo */
@media (max-width:640px){
  .amigo,.amigo.dir,.amigo.esq{position:relative;top:auto;left:auto;right:auto;display:flex;justify-content:center;margin:34px auto 0}
  .amigo .sprite{--h:210px!important}
}
.brand img{height:42px;width:auto}
.brand .ver{font-family:var(--display);font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);opacity:.55}

/* Lição */
.lesson{position:fixed;inset:0;z-index:20;background:var(--cream);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{max-width:720px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon-btn{border:0;background:none;padding:6px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.icon-btn svg{width:26px;height:26px}
.progress{flex:1;height:16px;background:var(--locked);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.hint{border:2px solid var(--teal);background:var(--aqua);color:var(--teal);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.hint[disabled]{opacity:.4;cursor:default}
.l-body{flex:1;overflow-y:auto}
.l-in{max-width:720px;margin:0 auto;padding-block:8px 28px;display:flex;flex-direction:column;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kind{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.say{display:flex;align-items:flex-end;gap:12px}
.bubble{position:relative;background:var(--white);border:2px solid var(--border);border-radius:18px;padding:14px 16px;font-size:18px;font-weight:600;line-height:1.4;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--white);border-left:2px solid var(--border);border-bottom:2px solid var(--border);transform:rotate(45deg)}
.who{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--white);border:2px solid var(--border);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:600}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--border);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel,.opt.right{border-color:var(--teal);background:var(--aqua)}
.opt.wrong{border-color:var(--coral);background:var(--coral-bg)}
.opt.off{opacity:.35;text-decoration:line-through}
.opt[disabled]{cursor:default}
.sort-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--white);border:2px solid var(--border);border-radius:16px;padding:10px 12px}
.sort-row b{flex:1 1 160px;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--border);border-bottom-width:4px;background:var(--cream);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px}
.seg button.sel{background:var(--navy);border-color:var(--navy);color:var(--white)}
.sort-row.wrong{border-color:var(--coral);background:var(--coral-bg)}
.sort-row.right,.sort-row.hinted{border-color:var(--teal)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{background:var(--white);border:2px solid var(--border);border-bottom-width:5px;border-radius:14px;padding:12px;font-weight:600;font-size:15px;text-align:left;min-height:58px}
.tile.sel{border-color:var(--teal);background:var(--aqua)}
.tile.ok{opacity:.35;border-color:var(--teal);cursor:default}
.tile.bad{border-color:var(--coral);background:var(--coral-bg);animation:shake .3s}
.order-line{min-height:64px;border-bottom:2px solid var(--border);display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.order-line:empty::after{content:"Toque nos passos abaixo, na ordem";color:var(--muted);font-size:14px;padding:16px 0}
.bank-steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--white);border:2px solid var(--border);border-bottom-width:5px;border-radius:14px;padding:10px 14px;font-weight:600;text-align:left;display:flex;gap:10px;align-items:center}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--white);display:grid;place-items:center;font-size:12px;font-weight:700}
.step.ghost{visibility:hidden}
.jars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.jar{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.jar h4{font-size:16px}
.jar .val{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.jar .ctl{display:flex;gap:10px}
.jar .ctl button{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);border-bottom-width:4px;background:var(--cream);font-size:22px;font-weight:700;line-height:1}
.fill{width:100%;height:10px;border-radius:999px;background:var(--locked);overflow:hidden}
.fill i{display:block;height:100%;background:var(--teal)}
.left{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.rule{font-size:14px;color:var(--muted);text-align:center}
.l-foot{border-top:2px solid var(--border);background:var(--cream);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-foot.ok{background:var(--aqua);border-color:transparent}
.l-foot.no{background:var(--coral-bg);border-color:transparent}
.f-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.f-msg{flex:1 1 280px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.f-msg h3{font-size:20px;font-weight:800}
.l-foot.ok .f-msg h3{color:var(--teal)}
.l-foot.no .f-msg h3{color:var(--coral)}
.f-msg p{margin:2px 0 0;font-size:15px}
.btn{border:0;border-radius:999px;min-height:52px;padding:0 28px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--yellow);color:var(--navy);box-shadow:0 5px 0 var(--yellow-d);margin-left:auto}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-d)}
.btn[disabled]{background:var(--locked);color:var(--locked-d);box-shadow:0 5px 0 var(--locked-d);cursor:default}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);border:2px solid var(--border)}
.l-foot.ok .btn{background:var(--teal);color:var(--white);box-shadow:0 5px 0 #063c3d}
.l-foot.no .btn{background:var(--coral);color:var(--white);box-shadow:0 5px 0 #8f2f1f}

/* Modais e resultado */
.modal{position:fixed;inset:0;z-index:30;background:rgba(9,39,77,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--cream);border-radius:24px;max-width:540px;width:100%;max-height:calc(100% - 32px);overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:24px;font-weight:800}
.sheet p{margin:0;color:var(--muted)}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.faixas{display:grid;gap:10px}
.faixa{display:flex;align-items:center;gap:12px;text-align:left;background:var(--white);border:2px solid var(--border);border-bottom-width:5px;border-radius:16px;padding:12px 14px}
.faixa .pair{display:flex}
.faixa .pair .av+.av{margin-left:-12px}
.faixa b{font-family:var(--display);font-weight:800;font-size:17px;display:block}
.faixa small{color:var(--muted);font-size:13px}
.faixa.sel{border-color:var(--teal);background:var(--aqua)}
.mission{background:var(--white);border:2px dashed var(--teal);border-radius:18px;padding:16px;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.row .btn{margin-left:0}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--white);border:2px solid var(--border);border-bottom-width:5px;border-radius:16px;padding:12px 14px}
.choice b{font-family:var(--display);font-weight:800}
.choice span{font-size:13px;color:var(--muted)}
.result{position:fixed;inset:0;z-index:25;background:var(--cream);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.r-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r-in h2{font-size:30px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tile-s{border-radius:16px;border:2px solid var(--tc);overflow:hidden;background:var(--white)}
.tile-s small{display:block;background:var(--tc);color:var(--tk);font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.tile-s b{display:block;font-family:var(--display);font-weight:800;font-size:24px;padding:10px 4px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--navy);color:var(--white);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.trail.praia{background:#FCE9BF;padding:16px}
.trail.floresta{background:#DCEFD8;padding:16px}
.av.gold{box-shadow:0 0 0 3px #FFC12E}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.termo{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--teal);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help}
@media (max-width:620px){.today{grid-template-columns:minmax(0,1fr)}}
.today .prod{background:var(--white)}

/* v3.0 · escassez: evento da semana e missões do dia */
.evento,.missoes{background:var(--white);border:2px solid var(--yellow);border-radius:20px;padding:14px 16px;margin:0 0 12px}
.evento h3{margin:2px 0 4px}.evento p,.missoes p{margin:4px 0;font-size:14px}
.ev-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ev-premio{flex:0 0 56px;width:56px;height:56px}.ev-premio svg{width:100%;height:100%}
.ev-bar{height:10px;border-radius:999px;background:rgba(9,39,77,.1);overflow:hidden;margin:8px 0}.ev-bar i{display:block;height:100%;background:var(--yellow);border-radius:999px}
.evento .row-sb .sbtn{white-space:nowrap;flex:0 0 auto}.ev-loja{color:var(--muted)}.ev-porque summary{cursor:pointer;font-weight:600;font-size:14px;margin-top:4px}
.missoes{border-color:var(--teal)}.md-prazo{font-size:13px;color:var(--muted)}
.md-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(9,39,77,.1);font-size:15px}
.md-row .sbtn{white-space:nowrap;flex:0 0 auto}.md-row>span:first-child{flex:1 1 auto}.md-ok{font-size:13px;color:var(--teal);font-weight:600;white-space:nowrap}.md-mes{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(9,39,77,.2)}
.md-nota{color:var(--muted)}.md-coll{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.md-med{font-size:13px;background:rgba(255,193,46,.25);border-radius:999px;padding:2px 10px}

/* v3.1 · rodapé de dados de uso e perfil opcional */
.rodape-dados{max-width:1100px;margin:8px auto 24px;padding:10px 16px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;text-align:center}
.linkbtn{background:none;border:0;padding:4px 2px;font:inherit;font-weight:600;color:var(--teal);text-decoration:underline;cursor:pointer}
label.pf{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-weight:600;font-size:14px}
label.pf input,label.pf select{font:inherit;font-weight:400;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(9,39,77,.25);background:#fff;min-height:44px}
.pf-nota{font-size:13px;color:var(--muted)}

/* v3.2 · materiais das missões e desafios de entrada e saída */
.mat-btns{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.modal.mat .sheet{max-height:90vh;overflow:auto}
.mat-nota{font-family:ui-monospace,Consolas,monospace;font-size:14px;border:1.5px dashed var(--navy);border-radius:12px;padding:12px;margin:8px 0;background:#fff}
.mat-selo{font-weight:700;text-align:center;border:2px solid var(--navy);padding:3px;margin-bottom:8px;letter-spacing:.04em}
.mat-t{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}.mat-t th,.mat-t td{border-bottom:1px solid rgba(9,39,77,.15);padding:5px 4px;text-align:left}
.mat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}@media(max-width:480px){.mat-grid{grid-template-columns:1fr}}
.mat-box{border:1.5px solid rgba(9,39,77,.2);border-radius:12px;padding:10px;background:#fff;font:inherit;font-size:14px;text-align:left;color:inherit}
.mat-ad{cursor:pointer}.mat-ad.on{border-color:var(--red,#C8462F);background:rgba(200,70,47,.08)}
.mat-fb{font-weight:600;min-height:1.2em}
.aval-card{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--white);border:2px solid var(--navy);border-radius:20px;padding:14px 16px;margin:0 0 12px}
.aval-card p{margin:2px 0 0;font-size:14px}.aval-card .sbtn{white-space:nowrap;flex:0 0 auto}
.aval-q{font-size:20px;line-height:1.35}.aval-ops{display:flex;flex-direction:column;gap:8px;margin:10px 0}.aval-nota{font-size:13px;color:var(--muted)}

/* v3.3 · nova entrada e nova tela principal */
.passos{display:flex;gap:6px;margin-bottom:10px}.passos i{flex:1;height:6px;border-radius:99px;background:var(--border)}.passos i.on{background:var(--teal)}
.cd-cod{font-size:13px;background:#E7F5F5;border-radius:12px;padding:8px 12px;color:#075C5E}.cd-erro{color:#A33A26;font-weight:600;font-size:14px;min-height:1.2em;margin:4px 0}
.turmas{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.turma{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:18px;border:2px solid var(--border);background:var(--white);font:inherit;text-align:left;cursor:pointer;color:var(--navy)}
.turma span{display:flex;flex-direction:column;flex:1 1 auto}.turma b{font-family:var(--display);font-size:18px}.turma small{color:var(--muted);font-size:13px}
.turma em{font-style:normal;font-size:11px;font-weight:700;color:#075C5E;background:#D3EEEE;border-radius:99px;padding:3px 8px;white-space:nowrap}
.turma.sel{border-color:var(--teal);background:#E7F5F5;box-shadow:0 0 0 3px rgba(11,122,125,.18)}
.turma-resp{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:10px 12px;margin:4px 0 8px}
.ev-icone{position:relative;display:flex;align-items:center;gap:4px;border:0;border-radius:12px;background:#6B3FA0;color:#fff;padding:6px 8px;font:inherit;font-weight:800;font-size:12px;cursor:pointer;margin-left:auto}
.ev-linha{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;background:#F1EAFB;color:#4B2A78;padding:8px 12px;font:inherit;font-size:14px;text-align:left;cursor:pointer;margin:0 0 12px}
.ev-linha .ev-ico{flex:0 0 32px;width:32px;height:32px}.ev-linha .ev-ico svg{width:100%;height:100%}.ev-linha span:nth-child(2){flex:1 1 auto}.ev-ver{font-weight:700;text-decoration:underline}
.hero{background:var(--teal);color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
.hero .eyebrow{color:#fff;opacity:.85}.hero-in{display:flex;align-items:center;gap:12px}.hero-in b{display:block;font-family:var(--display);font-size:21px;line-height:1.2}.hero-in small{opacity:.9;font-size:13px}
.hero .btn{width:100%}
.semana-linha{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:8px 12px;font-size:14px;margin:0 0 10px}.semana-linha .mesada{color:#2E8B57;font-weight:600}
.atalhos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}
.atalho{min-height:48px;border-radius:14px;border:1.5px solid var(--border);background:var(--white);font:inherit;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;padding:6px}
.atalho.feito{color:var(--muted);background:transparent}
.secao-topo h2{margin:0 0 4px}.secao-topo p{margin:0 0 12px;color:var(--muted)}
.mais{display:flex;flex-direction:column;gap:10px}.mais-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--border);background:var(--white);font:inherit;color:var(--navy);cursor:pointer}.mais-item b{font-size:16px}.mais-item small{color:var(--muted);font-size:13px}
.nav-baixo{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--white);border-top:2px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{position:relative;flex:1 1 0;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;background:none;border:0;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.nb.on{color:var(--teal)}.nb-badge{position:absolute;top:4px;right:calc(50% - 22px);background:#C8462F;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px}
.page{padding-bottom:110px!important}.rodape-dados{margin-bottom:90px!important}
@media (max-width:860px){.side{display:none}}

/* v3.5 · primeiros passos, como funciona, passo atual */
.pp-lista{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}.como-funciona summary{cursor:pointer;padding:2px 0}.como-funciona .sbtn{margin-top:6px}
.node-wrap.pulsa .node{animation:pulsaV34 .6s cubic-bezier(.34,1.56,.64,1) 2}
/* v3.4 · Sementes a receber, sequência de acertos, comemorações */
.stat.receber{font-size:13px;color:#2E8B57;background:#E9F5EE;border-radius:999px;padding:3px 9px;white-space:nowrap}
.stat.receber small{font-size:10px;font-weight:600;margin-left:3px;color:#2E8B57}
@keyframes pulsaV34{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
.pulsa{animation:pulsaV34 .45s cubic-bezier(.34,1.56,.64,1)}
body.sem-anim .pulsa{animation:none}
.seq{display:inline-block;margin-left:6px;font-size:13px;font-weight:800;color:#fff;background:#E8740C;border-radius:999px;padding:2px 9px;vertical-align:middle}
.celebra{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.celebra-ico{width:96px;height:96px}.celebra-ico svg{width:100%;height:100%}
.celebra .btn{min-width:220px}
.season{background:var(--navy);color:var(--white);border-radius:20px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.season .eyebrow{color:var(--yellow)}
.season p{margin:0;font-size:14px;opacity:.9}
.leaves{font-size:20px;letter-spacing:2px;color:#2E8B57}
.node.open{animation:bob 1.6s ease-in-out infinite}
.nivel{border-left:6px solid var(--yellow);padding:6px 0 6px 14px;margin-top:8px}
.nivel .eyebrow{font-size:14px;color:var(--navy)}
.nivel p{margin:2px 0 0;color:var(--muted);font-size:14px}
.nivel .nivel-prog{font-weight:700;color:var(--teal)}
.unit-head .obj{margin:4px 0 0;font-size:15px;opacity:.92}
.graus{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.graus span{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.04em;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.18);opacity:.6}
.graus span.on{opacity:1}
.graus.big{justify-content:center;margin:0}.graus.big span{font-size:14px;padding:5px 14px;background:var(--locked);color:var(--locked-d);opacity:1}
.graus .g1.on{background:#C98A55;color:#fff}.graus .g2.on{background:#D7DEE5;color:#09274D}.graus .g3.on{background:#FFC12E;color:#09274D}
.nivel .novo{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;margin-left:6px;vertical-align:2px}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0 18px}
.soon{border:2px dashed var(--border);border-radius:18px;padding:14px 16px;background:var(--white);opacity:.92}
.soon-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--navy)}
.soon-h span{flex:1}.soon-h em{font-style:normal;font-size:11px;font-weight:800;color:var(--teal);background:var(--aqua);border-radius:999px;padding:2px 8px;white-space:nowrap}
.soon p{margin:6px 0 4px;color:var(--muted);font-size:14px}
.soon ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.45}
.trail.noite .soon{background:#13305A;border-color:#2B4A78}.trail.noite .soon-h{color:#fff}.trail.noite .soon p,.trail.noite .soon ul{color:#CFE3F5}

    `<span>${c.name[0]}</span><img src="${ART}${id}-${faceOf(id,mood)}.webp" alt="${c.name}" onerror="this.remove()">${id==='tiko'?accBadges():''}</div>`;
}
/* Figura de corpo inteiro animada. kind: uma das poses (oi, aponta, ok, pensa, obj, fim), 'pose' (= fim) ou 'full' (= oi) */
function sprite(id,h=150,kind='full',cls=''){
  const c=CHARS[id]||CHARS.tiko;if(!c.full)return av(id,Math.round(h*.55),cls.includes('cheer')?'cheer':'');
  return `<div class="sprite ${cls}" style="--h:${h}px;--d:${(.5+Math.random()*2.5).toFixed(2)}s" data-who="${id}" title="${c.name}"><img src="${ART}${id}-${kind==='pose'?c.pose:(c.poses.includes(kind)?kind:c.full)}.webp" alt="${c.name}" onerror="this.closest('.sprite').classList.add('sem-img')">${id==='tiko'?accBadges():''}</div>`;
}
/* v3.6: troca a pose de uma figura já na tela (acerto: ok; erro: pensa). Se a imagem faltar, volta para a anterior */
function trocaPose(sp,pose){const im=sp&&sp.querySelector('img'),c=CHARS[sp&&sp.dataset.who];if(!im||!c||!c.poses||!c.poses.includes(pose))return;
  const antes=im.getAttribute('src');im.onerror=()=>{im.onerror=null;im.src=antes};im.src=ART+sp.dataset.who+'-'+pose+'.webp'}
/* Repete uma animação no mesmo elemento */
function anim(el,cls){if(!el)return;el.classList.remove('jump','tilt','pop');void el.offsetWidth;el.classList.add(cls)}
/* Brilhos e moedas que saem de quem fala quando a resposta está certa */
function burst(el,n=6){if(!el||!animOn())return;const r=el.getBoundingClientRect();
  if(calmo())n=2;const tipos=[PROP.brilho,PROP.moeda,PROP.semente,PROP.brilho,PROP.coracao];
  for(let i=0;i<n;i++){const s=document.createElement('i');s.className='fx';s.innerHTML=tipos[i%tipos.length];
    s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height*.35)+'px';
    s.style.setProperty('--dx',(Math.cos(i/n*Math.PI*2-1.2)*(70+Math.random()*40)).toFixed(0)+'px');s.style.setProperty('--dy',(-60-Math.random()*70).toFixed(0)+'px');
    s.style.animationDelay=(i*45)+'ms';document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
/* Cena do resultado: o personagem comemora e as Sementes caem no cofrinho */
function cenaResultado(id,sem){
  const moedas=Math.min(6,Math.max(1,Math.round(sem/2)));
  return `<div class="cena">${comPersonagens()?sprite(id,calmo()?200:300,'fim','pop'):''}
    <div class="cofre">${Array.from({length:moedas},(_,i)=>`<i class="cai" style="animation-delay:${.5+i*.18}s;left:${30+((i*17)%40)}%">${PROP.moeda}</i>`).join('')}${PROP.cofrinho}</div></div>`;
}

function simplify(e){
  if(e.type==='choice'&&e.opts.length>2){const w=e.opts.findIndex((o,i)=>i!==e.ans);const keep=[e.ans,w].sort((a,b)=>a-b);return {...e,opts:keep.map(i=>e.opts[i]),ans:keep.indexOf(e.ans)}}
  if(e.type==='sort'&&e.items.length>4){const a=e.items.filter(x=>x[1]===0),b=e.items.filter(x=>x[1]===1);return {...e,items:[a[0],b[0],a[1],b[1]].filter(Boolean)}}
  if(e.type==='match'&&e.pairs.length>3)return {...e,pairs:e.pairs.slice(0,3)};
  if(e.type==='order'&&e.steps.length>4)return null;
  return e;

T("p14c11#1", {type:"choice", q:"Você guardou R$ 3.000 do primeiro emprego na caixinha de um banco digital, que é um CDB. Se esse banco quebrar, o que acontece?", opts:["Perde tudo, porque banco digital não tem garantia","O FGC cobre, porque fica abaixo do limite de R$ 250 mil","Só recebe de volta se o banco for grande"], ans:1, exp:"CDB de banco associado ao FGC tem garantia de até R$ 250 mil por CPF em cada instituição. Confira no app se o produto tem FGC: algumas aplicações não têm."})

OV("14-17", "n8b-G3#0", {exp:"Faça a conta do ano. Com carteira: 12 × R$ 2.200, mais o 13º (R$ 2.200), mais um terço de férias (cerca de R$ 730) e o FGTS de 8% (cerca de R$ 2.350) dão perto de R$ 31,7 mil, além da proteção do INSS. Sem registro: 12 × R$ 2.400 = R$ 28,8 mil, sem esses direitos. Quem trabalha por conta própria pode se proteger contribuindo ao INSS como autônomo ou MEI."})
OV("14-17", "n11cl1#2", {exp:"A reserva precisa estar lá no dia do imprevisto. Na prática, opções comuns são o Tesouro Selic, um CDB de liquidez diária que pague pelo menos 100% do CDI dentro do limite do FGC, uma conta remunerada ou a poupança. Resgates em menos de 30 dias pagam IOF, e a poupança só rende no dia do \"aniversário\". Comparação para aprender, não recomendação."})

A("n14al1#2", {who:"natty", exp:"Prazos longos somam muitos juros. Compare o CET, que inclui os seguros obrigatórios (morte e invalidez, danos ao imóvel). O FGTS pode ajudar na entrada e a amortizar o saldo, e há programas habitacionais por faixa de renda."})
A("n14a-G2#3", {exp:"No SAC se paga mais no começo e menos juros no total. Os bancos costumam limitar a parcela a cerca de 30% da renda. Ao adiantar parcelas, escolher reduzir o prazo costuma economizar mais juros do que reduzir o valor da parcela."})

OV("14-17", "n9c-G3#3", {exp:"Organização durante o ano deixa a declaração simples. Antes de enviar, compare a simplificada com a completa e veja qual dá menos imposto. Use a pré-preenchida e confira se os dados batem com os informes, para evitar a malha fina."})
OV("14-17", "n8cl2#1", {exp:"O MEI tem CNPJ, emite nota fiscal e paga todo mês uma taxa fixa, o DAS, que inclui a contribuição ao INSS e dá direito, por exemplo, à aposentadoria por idade de um salário mínimo. Há um teto de faturamento por ano (confira o valor no Portal do Empreendedor) e uma declaração anual obrigatória."})

  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.16,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.22);
  o.connect(g).connect(ac.destination);o.start(t+i*.11);o.stop(t+i*.11+.25)})}catch(e){}}

function nivelLinha(l){
  const lic=l.licoes.filter(id=>LESSONS.some(n=>n.id===id));
  const feitas=lic.filter(id=>S.done[id]);if(!feitas.length)return 0;
  const jogadas=feitas.filter(id=>!S.pulou[id]);if(!jogadas.length)return 2; // só pelo nivelamento
  const media=jogadas.reduce((a,id)=>a+(S.acc[id]??0),0)/jogadas.length;
  const unidades=UNITS.filter(u=>u.lessons.some(x=>l.licoes.includes(x.id)));
  const missao=unidades.some(u=>S.missions[u.id]);
  if(feitas.length===lic.length&&media>=80&&missao)return 3;
  if(feitas.length*2>=lic.length&&media>=80)return 2;
  return 1;
}

const JOG_MIN=5*60*1000;

function dispositivo(){
  const ua=navigator.userAgent||'',ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const so=ios?'iOS':/Android/i.test(ua)?'Android':/Windows/i.test(ua)?'Windows':/CrOS/i.test(ua)?'ChromeOS':/Mac OS X|Macintosh/i.test(ua)?'macOS':/Linux/i.test(ua)?'Linux':'outro';
  const tablet=/iPad|Tablet/i.test(ua)||(ios&&!/iPhone|iPod/i.test(ua))||(/Android/i.test(ua)&&!/Mobile/i.test(ua));
  const tipo=tablet?'tablet':(/Mobi|iPhone|iPod|Android/i.test(ua)?'celular':'computador');
  const navg=/SamsungBrowser/i.test(ua)?'Samsung Internet':/Edg\//.test(ua)?'Edge':/OPR\//.test(ua)?'Opera':/Firefox|FxiOS/i.test(ua)?'Firefox':/CriOS|Chrome/i.test(ua)?'Chrome':/Safari/i.test(ua)?'Safari':'outro';
  let app=false;try{app=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){}
  return {tipo,so,navegador:navg,app,tela:`${screen.width}x${screen.height}`,idioma:navigator.language||''};
}
const versaoTxt=()=>((document.querySelector('.brand .ver')||{}).textContent||'').replace(/ · teste$/,'');
let jogOcupado=false;
async function sincronizarJogador(o={}){
  if(!S.faixa||S.teste||jogOcupado)return;const j=jogador();if(!j.envio||!NUVEM.key||/KEY_AQUI/.test(NUVEM.key))return;
  if(!o.force&&j.ultimo&&Date.now()-j.ultimo<JOG_MIN)return;
  jogOcupado=true;
  try{
    const p=S.perfilJog||{};
    await rpc('jogador_atualizar',{p_id:j.id,p_segredo:j.seg,p_perfil:{faixa:S.faixa,perfil:S.perfil||null,idade:p.idade||null,genero:p.genero||null,uf:p.uf||null,origem:p.origem||null,dispositivo:dispositivo(),versao:versaoTxt(),codigo:S.codigo||null}},o.keepalive);
    await rpc('jogador_enviar',{p_id:j.id,p_segredo:j.seg,p_semana:o.semana||S.week,p_dados:o.dados||dadosResumo()},o.keepalive);
    j.ultimo=Date.now();j.erro='';save();

}

const GLOS_KEYS=Object.keys(GLOSSARIO).sort((a,b)=>b.length-a.length);
const GLOS_RE=new RegExp(`(?<![\\p{L}])(${GLOS_KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})(?![\\p{L}])`,'giu');
function glossar(txt){const usados=new Set();
  return txt.replace(GLOS_RE,m=>{const k=GLOS_KEYS.find(x=>x.toLowerCase()===m.toLowerCase());if(!k||usados.has(k)||usados.size>=3)return m;usados.add(k);
    return `<button class="termo" data-act="termo" data-t="${k}" title="O que é ${k}?">${m}</button>`})}

/* v3.5: a rota do piloto segue a ordem da trilha (do mais simples ao mais complexo). A sugestão da semana são as próximas lições não feitas. */

const rotaSemana=()=>Math.min(4,Math.max(1,S.week||1));
function licaoDaRota(id){for(const u of UNITS){const l=u.lessons.find(x=>x.id===id);if(l)return {u,l}}return null}
const proximasLicoes=(n=3)=>LESSONS.filter(x=>!S.done[x.id]).slice(0,n).map(x=>x.id);
const rotaIds=()=>new Set(LESSONS.map(x=>x.id));
const emRota=id=>true;            // toda lição da trilha conta dia de prática
const missaoEmRota=uid=>true;     // toda Missão na Vida Real conta dia de prática

function viewTrilhaBase(){
  const OFF=[0,1,1.5,1,0,-1,-1.5,-1];let k=0;
  const nodeHtml=(st,label,icon,attrs,tag)=>{const x=OFF[k++%OFF.length]*48;const hot=st==='current';/* v3.5.3: só o próximo passo ganha balão e anel */const toque=(attrs.match(/data-act="node" data-i="\d+"/)||[''])[0]; // v3.5.1: o balão COMEÇAR e o nome da lição também abrem
    return `<div class="node-wrap ${hot?'current':''}" style="transform:translateX(${x}px)">${hot?`<span class="start-tag" ${toque} role="button">${tag}</span>`:''}
      <button class="node ${st}" ${attrs} aria-label="${label}${st==='locked'?' (bloqueada)':''}">${icon}</button><span class="node-label" ${toque}>${label}</span></div>`};
  const nx=nextLesson();
  const units=UV().map((u,ui)=>{
    const quem=cast(u.mission.who),aqui=nx&&nx.u===u;
    const amigo=comPersonagens()?`<div class="amigo ${ui%2?'esq':'dir'}">${aqui?`<span class="fala">${calmo()?'Próximo passo':'Sua vez!'}</span>`:''}${sprite(aqui?guideId():quem,aqui?260:230,aqui?'oi':['aponta','ok','obj','oi','fim'][ui%5])}</div>`:'';
    const nodes=NODES.map((n,i)=>({n,i})).filter(x=>x.n.u===u).map(({n,i})=>{
      const st=nodeState(n);
      if(n.kind==='grau'){const g=grauDe(n.u),alvo=Math.min(3,Math.max(2,g+1)),d=diasParaOuro(n.u);
        const label=st==='done'?(grauDe(n.u)<3&&unidadeNivelada(n.u)?'Desafio opcional · nivelamento':'Ouro conquistado'):`Desafio ${GRAUS[alvo]}${st==='wait'?` · abre em ${d} ${d===1?'dia':'dias'}`:''}`;
        const cor=alvo===3||st==='done'?'--u:#E8A317;--ink:#09274D':'--u:#8C9BAB;--ink:#FFFFFF';
        return nodeHtml(st==='wait'?'locked':st,label,st==='locked'||st==='wait'?I.lock:I.medal,`data-act="node" data-i="${i}" style="${cor}"`,GRAUS[alvo].toUpperCase())}
      const icon=st==='locked'?I.lock:(n.kind==='mission'?I.flag:(st==='done'?I.check:I.nodeStar));
      return nodeHtml(st,n.kind==='mission'?'Missão na Vida Real'+(!S.missions[n.u.id]&&unidadeNivelada(n.u)?' · nivelamento':''):n.l.title+(S.pulou[n.id]?' · nivelamento':''),icon,`data-act="node" data-i="${i}"`,n.kind==='mission'?'MISSÃO':'COMEÇAR');
    }).join('');
    const nv=NIVEIS_TRILHA[nivelDe(u.id)];
    const nvUnits=nv?nv.units.map(id=>UNITS.find(x=>x.id===id)).filter(unidadeVisivel):[];
    const banda=nv&&nv.units[0]===u.id?`<div class="nivel"><div class="eyebrow">${nivelNome(nv)}${nv.lancamento?' <span class="novo">Novo</span>':''}</div><p>${nv.desc}</p><p class="nivel-prog">${nvUnits.filter(unitLessonsDone).length} de ${nvUnits.length} objetivos alcançados</p></div>`:'';
    const ok=unitLessonsDone(u),g=grauDe(u);
    const graus=`<div class="graus" aria-label="Grau de domínio: ${g?GRAUS[g]:'ainda nenhum'}">${[1,2,3].map(k=>`<span class="g${k} ${g>=k?'on':''}">${GRAUS[k]}</span>`).join('')}</div>`;
    return `${banda}<section style="--u:${u.color};--ink:${u.ink}"><div class="unit-head">${S.selos[u.id]?'<span class="selo">Selo conquistado</span>':''}<div class="eb">${ok?'Objetivo alcançado ✓':'Objetivo'}</div><h2>${u.title}</h2><p class="obj">${OBJETIVOS[u.id]||''}</p>${graus}</div><div class="nodes">${nodes}</div>${amigo}</section>`;
  }).join('');
  const futuros=NIVEIS_TRILHA.filter(n=>n.futuro&&nivelVisivel(n));
  const futHtml=futuros.length?`<div class="nivel"><div class="eyebrow">Próximos níveis</div><p>A jornada continua. Um nível novo chega a cada temporada, e tudo o que você conquistou fica com você.</p></div>
    <div class="soon-grid">${futuros.map(nv=>`<div class="soon"><div class="soon-h">${ico(I.lock,18)}<span>${nivelNome(nv)}</span><em>Em breve</em></div><p>${nv.desc}</p><ul>${nv.objetivos.map(o=>`<li>${o}</li>`).join('')}</ul></div>`).join('')}</div>`:'';
  const areas=AREAS.filter(a=>S.owned[a.id]);
  const areaHtml=areas.length?`<section style="--u:#E8A317;--ink:#09274D"><div class="unit-head"><div class="eb">Áreas descobertas</div><h2>Lugares novos do mapa</h2></div><div class="nodes">${
    areas.map(a=>nodeHtml(S.areasDone[a.lesson.id]?'done':'current',`${a.name}: ${a.lesson.title}`,S.areasDone[a.lesson.id]?I.check:I.map,`data-act="area" data-id="${a.id}" style="--u:${a.color};--ink:${a.ink}"`,'EXPLORAR')).join('')}</div></section>`:'';
  const tema=['noite','praia','floresta'].find(t=>S.equip[t])||'';
  const recado=S.recado&&!S.recado.visto?`<div class="card" style="border-color:var(--teal);background:var(--aqua)"><div class="eyebrow">Recado de casa</div><h3>${S.recado.texto}</h3><p>Alguém da família viu o seu esforço na trilha.</p><div class="btns"><button class="sbtn dark" data-act="recadoOk">Obrigado!</button></div></div>`:'';
  const pr=UV().filter(u=>grauDe(u)>=2).length,ou=UV().filter(u=>grauDe(u)>=3).length;
  return `${recado}${viewToday()}<div class="trail ${tema}">${units}${areaHtml}${futHtml}
    <div class="card" style="text-align:center"><h3>Até aqui, por enquanto</h3><p>${UV().filter(unitLessonsDone).length} de ${UV().length} objetivos alcançados · ${pr} em Prata · ${ou} em Ouro. Os Desafios Prata e Ouro, as áreas da Loja e a Revisão do dia continuam enquanto os próximos níveis não chegam.</p></div></div>`;
}

const regraTotal=()=>POTS.reduce((a,p)=>a+S.regra[p.k],0);
function chart(){
  const h=S.history;if(h.length<2)return '<p style="margin-top:8px">Passe algumas semanas para ver a linha do saldo.</p>';
  const W=560,H=180,l=40,r=90,t=12,bt=28,max=Math.max(10,...h.map(x=>Math.max(x.total,x.dep)));
  const X=i=>l+i/(h.length-1)*(W-l-r),Y=v=>H-bt-v/max*(H-bt-t);
  const line=k=>h.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x[k]).toFixed(1)}`).join('');
  const last=h.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo do Banco por semana"><line x1="${l}" x2="${W-r}" y1="${H-bt}" y2="${H-bt}" stroke="#EADFC9"/>

    }else if(it.marco){
      body=`<div class="cost">Não está à venda: chega sozinho com ${it.marco} semanas seguidas de Ritmo. Seu Ritmo: ${S.ritmo}.</div>`;
    }else{
      const lockSelo=area&&!S.selos[area.needSelo];
      const n=Math.ceil(price/sonhoSemanal());
      const meta=S.sonhoMeta&&S.sonhoMeta!==it.id?SHOP.find(x=>x.id===S.sonhoMeta):null;
      const cost=meta?`Custo na etiqueta: atrasa seu Sonho (${meta.name}) em cerca de ${n} ${n===1?'semana':'semanas'}.`:`Custo na etiqueta: equivale a ${n} ${n===1?'semana':'semanas'} do seu pote Sonho.`;

      if(lockSelo)body+=`<div class="warn">Precisa do Selo da missão "${UNITS.find(u=>u.id===area.needSelo).title}".</div>`;

      else body+=`<div class="btns" style="margin-top:0"><button class="sbtn pri" data-act="buy" data-id="${it.id}" data-m="vista" ${S.pots.agora<vista?'disabled':''}>${price>=PARCELA_MIN?`À vista ${vista} (−10%)`:`Comprar ${vista}`}</button>${price>=PARCELA_MIN&&parcelaOk()?`<button class="sbtn" data-act="buy" data-id="${it.id}" data-m="parc" ${S.pots.agora<Math.ceil(price/4)?'disabled':''}>4 × ${Math.ceil(price/4)}</button>`:''}</div>${S.pots.agora<vista?`<p class="tagline">Faltam ${f0(vista-S.pots.agora)} no pote Agora. Dá para tirar do Cofrinho no Banco.</p>`:''}`;

}

/* ---------- Dia da Mesada: divisão nos potes ---------- */
function askSplit(total,reason,then){
  total=Math.round(total);if(total<=0){then&&then();return}
  const v={};let used=0;POTS.forEach(p=>{v[p.k]=Math.floor(total*S.regra[p.k]/100);used+=v[p.k]});v.agora+=total-used;
  const m=modal('');
  const draw=()=>{const sum=POTS.reduce((a,p)=>a+v[p.k],0);
    m.firstChild.innerHTML=`<div class="eyebrow">${reason}</div><h2>${total} Sementes para dividir</h2><p>Sua regra dos potes já preencheu a divisão. Mude se quiser.</p>
      ${POTS.map(p=>`<div class="rule-row"><span><b style="color:${p.c==='#FFC12E'?'var(--navy)':p.c};min-width:0;text-align:left">${p.name}</b></span><span class="stepper"><button data-s="${p.k}" data-d="-1" aria-label="Menos">−</button><b>${v[p.k]}</b><button data-s="${p.k}" data-d="1" aria-label="Mais">+</button></span></div>`).join('')}
      <div class="row-sb"><span>${sum===total?'Tudo dividido':(sum<total?`Faltam ${total-sum}`:`Passou ${sum-total}`)}</span><span>${dobro()?'Semana do Dobro: o Compartilhar vale 2×':'Sonho e Reserva vão para a Árvore, que rende'}</span></div>
      <div class="row"><button class="btn" id="sp-ok" ${sum!==total?'disabled':''}>Confirmar divisão</button></div>`;
    m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s,nv=v[k]+(+b.dataset.d);if(nv<0)return;v[k]=nv;draw()});
    m.querySelector('#sp-ok').onclick=()=>{S.pots.agora+=v.agora;S.pots.reserva+=v.reserva;S.bank.arvore+=v.sonho;S.bank.depositado+=v.reserva+v.sonho;
      S.mutirao.meu+=v.compartilhar;addMutirao(v.compartilhar*(dobro()?2:1));save();m.remove();render();then&&then()};
  };draw();
}
function addMutirao(x){const m=S.mutirao;m.total+=x;while(m.total>=m.meta){m.total-=m.meta;m.nivel++;m.meta+=150;S.estrelas+=20;toast('Mutirão fechado! A família inteira ganhou a Bandeira e 20 Estrelas.')}}

/* ---------- Modo piloto: os dias passam pelo relógio ----------
   Por padrão o jogo roda como no piloto: sem botões de teste, e cada dia do calendário é um dia do jogo
   (a semana do jogo tem 7 dias a partir do primeiro dia em que a família abriu o jogo).
   Para testar, toque 5 vezes no rótulo da versão no topo: liga o modo de teste só neste aparelho. */
const DIA_MS=86400000;
const piloto=()=>!S.teste;
const hojeLocal=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const dataDoDia=abs=>new Date((S.inicio||hojeLocal())+(abs-1)*DIA_MS);
const dm=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
let sincronizando=false;
function sincronizarTempo(){
  if(!piloto()||!S.faixa||sincronizando||document.querySelector('.modal'))return;
  if(!S.inicio){S.inicio=hojeLocal()-(dayAbs()-1)*DIA_MS;save();return}
  const alvo=Math.max(1,Math.round((hojeLocal()-S.inicio)/DIA_MS)+1);
  if(alvo<=dayAbs())return;
  const semanaAlvo=Math.floor((alvo-1)/7)+1,diaAlvo=(alvo-1)%7+1;
  if(semanaAlvo===S.week){S.day=diaAlvo;save();render();return}
  sincronizando=true;
  // semanas inteiras longe do jogo: passam em silêncio; a última mostra o resumo e a divisão da Mesada
  while(S.week<semanaAlvo-1)advanceWeek({silencio:true});
  sincronizando=false;
  advanceWeek({dia:diaAlvo});
}
function alternarTeste(){
  S.teste=!S.teste;
  if(!S.teste)S.inicio=hojeLocal()-(dayAbs()-1)*DIA_MS; // volta para o relógio a partir do dia atual do jogo
  save();render();toast(S.teste?'Modo de teste ligado neste aparelho: os botões de tempo voltaram.':'Modo piloto: os dias passam pelo calendário.');
}
let toquesVer=0,toqueT=0;
document.addEventListener('click',e=>{if(!e.target.closest('.brand .ver'))return;const t=Date.now();toquesVer=t-toqueT<1500?toquesVer+1:1;toqueT=t;if(toquesVer>=5){toquesVer=0;alternarTeste()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizarTempo()});
setInterval(sincronizarTempo,60000);

/* Resumo da semana para o piloto: sem nome e sem dado pessoal, só o que o roteiro do piloto pede */
function resumoRota(){

function harvest(list,then){
  if(!list.length)return then&&then();
  const l=list[0],r=taxaEscada(l.prazo),j=l.v*r,k=Math.floor(52/l.prazo);
  const comp=l.v*Math.pow(1+r,k),simp=l.v+l.v*r*k;
  S.bank.juros+=j;save();
  const meta=S.sonhoMeta?SHOP.find(x=>x.id===S.sonhoMeta):null;
  const daSonho=meta&&l.v+j+S.pots.agora+S.bank.cofrinho+S.bank.arvore>=shopPrice(meta);
  const m=modal(`<div class="eyebrow">Colheita · plantio de ${l.prazo} semanas</div><h2>${f1(l.v)} viraram ${f1(l.v+j)}</h2>
    <p>Rendeu ${fj(j)} Sementes de juros. O que fazer agora?</p>
    ${daSonho?`<div class="mission"><div class="eyebrow">Seu Sonho está ao alcance</div>Colhendo tudo, você já tem o suficiente para ${meta.name}. Replantar adia o Sonho por mais ${l.prazo} semanas.</div>`:''}

    <button class="choice" data-h="juros"><b>Colher só os juros e replantar o resto</b><span>${fj(j)} vão para o pote Agora. Fazendo isso sempre, em um ano o plantio mais os juros colhidos somam cerca de ${f0(simp)}: são juros simples, porque os juros não voltam a render.</span></button>
    <button class="choice" data-h="tudo"><b>Colher tudo para o Cofrinho</b><span>${f1(l.v+j)} ficam no Cofrinho, sem render e prontos para usar.</span></button>`);
  const replant=v=>{const room=Math.max(0,teto()-(S.bank.arvore+S.pots.reserva+lotsSum()));const x=Math.min(v,room);
    if(x>0)S.bank.lots.push({id:S.nextLot++,v:x,prazo:l.prazo,start:S.week,end:S.week+l.prazo});if(v-x>0){S.bank.cofrinho+=v-x;toast('Parte foi para o Cofrinho: o teto da faixa não deixa mais Sementes rendendo.')}};
  m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const h=b.dataset.h;
    if(h==='all')replant(l.v+j);else if(h==='juros'){S.pots.agora+=j;replant(l.v)}else S.bank.cofrinho+=l.v+j;
    save();m.remove();render();harvest(list.slice(1),then)});
}

function nivelamento(){
  const qs=[];const NV=NIVEIS_TRILHA.filter(n=>!n.resp&&!n.futuro);
  NV.forEach((nv,i)=>{const ls=nv.units.flatMap(id=>UNITS.find(u=>u.id===id).lessons.filter(visivel));

  const total=NV.map((_,i)=>qs.filter(q=>q.nivel===i).length),acertos=NV.map(()=>0);let k=0;

let L=null;
const KIND={choice:'Escolha uma resposta',sort:'Classifique',match:'Forme os pares',order:'Coloque em ordem',split:'Divida o dinheiro'};
function startLesson(lesson,unit,practice){
  if(limiteHoje()&&tempoHoje()>=limiteHoje()){

  }

  lesson={...lesson,ex:exFor(lesson)};
  L={lesson,unit,practice,queue:lesson.ex.map((_,i)=>i),total:lesson.ex.length,doneCount:0,firstTry:0,missed:new Set(),hints:nh,state:null};
  document.body.insertAdjacentHTML('beforeend',`<div class="lesson" id="lesson">

    <button class="hint" id="l-hint">${dicaName()} · ${nh}</button></div>
    <div class="l-body"><div class="l-in" id="l-in"></div></div><div class="l-foot" id="l-f"></div></div>`);
  $('#l-x').onclick=()=>{$('#lesson').remove();L=null;render()};
  $('#l-hint').onclick=useHint;
  nextEx();
}
function nextEx(){
  $('#l-p').style.width=(L.doneCount/L.total*100)+'%';
  if(!L.queue.length)return finishLesson();
  const ex=L.lesson.ex[L.queue[0]];L.state={ex,answer:null,checked:false};
  const who=cast(ex.who);
  $('#l-in').innerHTML=`<div class="kind">${KIND[ex.type]}${L.missed.has(L.queue[0])?' · de novo':''}${faixa().id==='5-7'?' · leia junto com um adulto':''}</div>
    <div class="palco">${comPersonagens()?`<div class="quem">${calmo()?av(who,80):sprite(who,280,L.doneCount===0&&!L.missed.size?'oi':(L.doneCount%3===2?'obj':'aponta'))}${PROP_UNIT[L.unit&&L.unit.id]?`<span class="prop" aria-hidden="true">${PROP[PROP_UNIT[L.unit.id]]}</span>`:''}</div>`:''}<div class="bubble"><span class="who">${CHARS[who].name}</span>${glossar(ex.q)}</div></div><div id="ex"></div>`;
  ({choice:rChoice,sort:rSort,match:rMatch,order:rOrder,split:rSplit})[ex.type](ex);
  if(ex.type!=='match')footCheck();
  updHint();
}
function updHint(){const h=$('#l-hint');if(h){h.textContent=`${dicaName()} · ${L.hints}`;h.disabled=!L.hints||L.state.checked}}
function footCheck(){const f=$('#l-f');f.className='l-foot';f.innerHTML='<div class="f-in">'+(L&&L.lesson&&L.lesson.grau?'':'<button class="sbtn" id="pular" type="button">Pular</button>')+'<button class="btn" id="chk" disabled>Verificar</button></div>';$('#chk').onclick=check;const pb=$('#pular');if(pb)pb.onclick=pular}
// R12: pular não conta como erro, não volta no fim e não diminui a precisão (que é calculada só sobre o que foi respondido)
function pular(){if(!L||!L.state||L.state.checked)return;const qi=L.queue.shift();L.pulados=(L.pulados||0)+1;evento('pulo',(L.lesson.id||'')+':'+qi);L.total=Math.max(L.doneCount+L.queue.length,1);save();nextEx()}
const ready=v=>{const b=$('#chk');if(b)b.disabled=!v};

function rChoice(ex){
  $('#ex').innerHTML=`<div class="opts">${ex.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o}</button>`).join('')}</div>`;
  $('#ex').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(L.state.checked||b.classList.contains('off'))return;
    $('#ex').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L.state.answer=+b.dataset.i;ready(true)});
  L.state.hint=()=>{const w=[...$('#ex').querySelectorAll('.opt')].find(b=>+b.dataset.i!==ex.ans&&!b.classList.contains('off'));
    if(!w)return false;w.classList.add('off');w.classList.remove('sel');w.disabled=true;if(L.state.answer===+w.dataset.i){L.state.answer=null;ready(false)}return true};
}
function rSort(ex){
  L.state.answer=ex.items.map(()=>null);
  $('#ex').innerHTML=`<div class="opts">${ex.items.map((it,i)=>`<div class="sort-row" data-r="${i}"><b>${it[0]}</b><div class="seg">${ex.buckets.map((bk,j)=>`<button data-i="${i}" data-j="${j}">${bk}</button>`).join('')}</div></div>`).join('')}</div>`;
  const pick=(i,j)=>{L.state.answer[i]=j;$('#ex').querySelectorAll(`[data-i="${i}"]`).forEach(x=>x.classList.toggle('sel',+x.dataset.j===j));ready(L.state.answer.every(v=>v!==null))};
  $('#ex').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{if(!L.state.checked)pick(+b.dataset.i,+b.dataset.j)});
  L.state.hint=()=>{const i=ex.items.findIndex((it,k)=>L.state.answer[k]!==it[1]);if(i<0)return false;pick(i,ex.items[i][1]);$('#ex').querySelector(`[data-r="${i}"]`).classList.add('hinted');return true};
}
function rOrder(ex){
  L.state.answer=[];const bank=shuffle(ex.steps.map((s,i)=>i));
  const draw=()=>{
    $('#ex').innerHTML=`<div class="order-line">${L.state.answer.map((i,p)=>`<button class="step" data-out="${p}"><span class="n">${p+1}</span>${ex.steps[i]}</button>`).join('')}</div>
      <div class="bank-steps">${bank.map(i=>`<button class="step ${L.state.answer.includes(i)?'ghost':''}" data-in="${i}">${ex.steps[i]}</button>`).join('')}</div>`;
    $('#ex').querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{if(L.state.checked)return;L.state.answer.push(+b.dataset.in);draw()});
    $('#ex').querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{if(L.state.checked)return;L.state.answer.splice(+b.dataset.out,1);draw()});
    ready(L.state.answer.length===ex.steps.length);
  };draw();
  L.state.hint=()=>{let k=0;while(k<L.state.answer.length&&L.state.answer[k]===k)k++;if(k>=ex.steps.length)return false;
    L.state.answer=Array.from({length:k+1},(_,i)=>i);draw();return true};
}
const unidadeDe=ex=>ex.unidade||(/ficha/i.test(ex.q||"")?"fichas":"reais");
const fmtUn=(ex,v)=>unidadeDe(ex)==="fichas"?`${v} ${v===1?"ficha":"fichas"}`:`R$ ${v}`;
function rSplit(ex){
  L.state.answer=ex.jars.map(()=>0);
