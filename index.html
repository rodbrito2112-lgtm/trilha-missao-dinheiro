<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A7D">
<meta name="description" content="Jogo de educação financeira para crianças, adolescentes e famílias.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="arte/icons/favicon-32.png">
<link rel="apple-touch-icon" href="arte/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missão Dinheiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Trilha Missão Dinheiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout v0.2: abas (Trilha, Banco, Loja, Mutirão) + painel lateral da semana; lição em tela cheia. Identidade única clara, cores do Manual da Marca. */
:root{
  /* Tokens do Manual da Marca Única v1.1: marinho #09274D, amarelo #FFC12E, turquesa #12B8BB (acentos rosa #F35A8B e roxo #7966D8).
     --teal é um tom mais escuro do turquesa, para textos com contraste AA; --turq é o turquesa da marca, para preenchimentos. */
  --navy:#09274D; --yellow:#FFC12E; --yellow-d:#D9A01C; --teal:#0B7A7D; --turq:#12B8BB; --rosa:#F35A8B; --roxo:#7966D8; --cream:#FFF8EC;
  --white:#FFFFFF; --border:#EADFC9; --muted:#3D4F66; --aqua:#E6F7F7;
  --coral:#C8462F; --coral-bg:#FDECE7; --locked:#E7DFCF; --locked-d:#CDBFA6; --night:#0E2547;
  --display:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--cream);color:var(--navy)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
/* Movimento: segue o pedido do sistema (menos movimento), mas o jogador pode ligar ou desligar no painel lateral */
.num{font-variant-numeric:tabular-nums}

/* HUD e abas */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:2px solid var(--border)}
.hud-in,.tabs-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-in{padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.05;margin-right:auto}
.brand img{height:38px}
.brand small{display:block;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:none;border:0;padding:4px}
.stat svg{width:22px;height:22px}
.stat small{font-weight:700;font-size:11px;color:var(--muted)}
.chip{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:800;font-size:13px}
.tabs-in{gap:6px;padding-block:0 10px;overflow-x:auto}
.tab{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:800;font-size:14px;white-space:nowrap}
.tab.on{background:var(--navy);border-color:var(--navy);color:var(--white)}

/* Página */
.page{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding-block:24px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.page{grid-template-columns:minmax(0,1fr)}}
.tab.week{border-style:dashed;color:var(--teal);margin-left:auto}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:18px;min-width:0}
.card h3{font-size:18px;font-weight:800;margin-bottom:4px}
.card h4{font-size:15px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.bar{height:14px;background:var(--locked);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .5s}
.row-sb{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.cast{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);width:64px;text-align:center}
.note{font-size:12px;color:var(--muted);border-top:1px dashed var(--border);padding-top:10px;margin-top:12px}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--locked);display:block}
.dots i.on{background:var(--teal)}
.test{border-style:dashed;background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sbtn{border:2px solid var(--border);border-bottom-width:4px;background:var(--cream);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.sbtn:active{transform:translateY(2px)}
.sbtn.pri{background:var(--yellow);border-color:var(--yellow-d)}
.sbtn.dark{background:var(--navy);border-color:#000;color:var(--white)}
.sbtn[disabled]{opacity:.45;cursor:default}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
.pot{border-radius:16px;padding:12px;background:var(--pc);color:var(--pk)}
.pot small{display:block;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.pot b{display:block;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.pot span{font-size:12px;opacity:.85}
.prod{border:2px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.prod .val{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.lot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:8px;font-size:14px}
.lot b{font-variant-numeric:tabular-nums}
.lot .grow{flex:1 1 160px}
table.calc{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:8px}
table.calc td,table.calc th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left}
table.calc tr.on td{font-weight:700;color:var(--teal)}
.rule-row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.rule-row b{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);border-bottom-width:4px;background:var(--cream);font-weight:700;font-size:18px;line-height:1}
select{font:inherit;border:2px solid var(--border);border-radius:12px;padding:6px 10px;background:var(--white);color:var(--navy)}

/* Loja */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.item .top{display:flex;align-items:center;gap:12px}
.item .kind{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.item h4{font-size:16px}
.item .price{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.item .tagline{font-size:13px;color:var(--muted)}
.item .warn{font-size:13px;color:var(--coral);font-weight:600}
.item .cost{font-size:13px;background:var(--aqua);border-radius:10px;padding:6px 10px;color:var(--teal)}
.item.owned{border-color:var(--teal)}
.icon-box{width:56px;height:56px;border-radius:14px;background:var(--cream);display:grid;place-items:center;flex:none;overflow:hidden}

/* Trilha */
.trail{display:flex;flex-direction:column;gap:28px;min-width:0;border-radius:24px;transition:background .3s}
.trail.night{background:var(--night);padding:16px}
.trail.night .node-label{color:#CFE3F5}
.unit-head{background:var(--u);color:var(--ink);border-radius:20px;padding:16px 20px;box-shadow:0 5px 0 color-mix(in srgb,var(--u) 72%,#000)}
.unit-head .eb{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:22px;font-weight:800;margin-top:2px}
.unit-head .selo{float:right;font-size:12px;font-weight:800;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;margin-left:8px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;border:0;background:var(--u);color:var(--ink);display:grid;place-items:center;box-shadow:0 7px 0 color-mix(in srgb,var(--u) 70%,#000);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--u) 70%,#000)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--locked);color:var(--locked-d);box-shadow:0 7px 0 var(--locked-d)}
.node-label{font-family:var(--display);font-weight:800;font-size:13px;margin-top:12px;color:var(--muted);max-width:150px;text-align:center;line-height:1.2}
.node.current{animation:bob 1.6s ease-in-out infinite}
.node-wrap.current::before{content:"";position:absolute;top:-8px;width:92px;height:86px;border-radius:50%;border:5px solid color-mix(in srgb,var(--u) 45%,transparent)}
.start-tag{position:absolute;top:-44px;background:var(--white);border:2px solid var(--border);border-radius:12px;padding:4px 12px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--teal);letter-spacing:.06em;white-space:nowrap}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--white);border-right:2px solid var(--border);border-bottom:2px solid var(--border);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Avatares */
.av{position:relative;flex:none;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;border:3px solid var(--white);box-shadow:0 0 0 2px var(--border)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--white);border-radius:50%}
.av span{font-size:calc(var(--s) * .42)}
.av.cheer{animation:cheer .6s ease 2}
.av.oops{animation:shake .4s ease}
@keyframes cheer{40%{transform:translateY(-8px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* Acessórios da Loja: selos ao lado do Tiko */
.acc{position:absolute;right:-6%;bottom:-6%;display:flex;gap:2px;z-index:2}
.acc i{width:clamp(18px,calc(var(--s,60px) * .36),40px);aspect-ratio:1;border-radius:50%;background:var(--white);border:2px solid var(--border);display:grid;place-items:center;padding:2px}
.acc svg{width:100%;height:100%}
.sprite .acc{right:0;bottom:6%}.sprite .acc i{width:34px}

/* Personagens de corpo inteiro: entram, respiram, pulam no acerto e inclinam no erro */
.sprite{position:relative;flex:none;height:var(--h);display:inline-flex;align-items:flex-end;transform-origin:50% 100%;animation:entra .7s cubic-bezier(.3,1.7,.5,1) both;padding-bottom:10px}
.sprite img{position:relative;z-index:1;height:calc(100% - 10px);width:auto;display:block;transform-origin:50% 100%;animation:vida 4.6s ease-in-out .7s infinite;animation-delay:var(--d,.7s);filter:drop-shadow(0 6px 4px rgba(9,39,77,.14))}
/* sombra no chão, que encolhe quando o personagem sobe */
.sprite::after{content:"";position:absolute;left:18%;right:18%;bottom:2px;height:12px;border-radius:50%;background:rgba(9,39,77,.16);animation:sombra 4.6s ease-in-out .7s infinite;animation-delay:var(--d,.7s)}
@keyframes vida{0%,100%{transform:translateY(0) rotate(-1.5deg)}20%{transform:translateY(-14px) rotate(1.5deg)}40%{transform:translateY(0) rotate(-1.5deg)}
  56%{transform:translateY(-10px) rotate(1deg)}66%{transform:translateY(0) scale(1.05,.94)}74%{transform:translateY(-30px) scale(.95,1.06) rotate(-3deg)}
  84%{transform:translateY(0) scale(1.06,.94)}92%{transform:translateY(-6px) scale(1)}}
@keyframes sombra{0%,40%,66%,84%,100%{transform:scale(1);opacity:1}20%,56%{transform:scale(.8);opacity:.7}74%{transform:scale(.6);opacity:.45}}
.sprite.sem-img{width:calc(var(--h) * .45);border-radius:999px 999px 20px 20px;background:var(--locked)}
.sprite.jump{animation:pula .75s cubic-bezier(.3,1.6,.5,1)}
.sprite.tilt{animation:inclina .7s ease}
.sprite.pop{animation:entra .6s cubic-bezier(.3,1.6,.5,1) both,pula .8s cubic-bezier(.3,1.6,.5,1) .6s}
@keyframes entra{from{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:none}}
@keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
@keyframes pula{0%{transform:none}18%{transform:scale(1.07,.9)}48%{transform:translateY(-26px) scale(.95,1.06) rotate(-3deg)}78%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes inclina{25%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
body.calmo .sprite{animation-duration:.35s}
body.calmo .sprite.jump,body.calmo .sprite.pop{animation:pula-c .5s ease}
@keyframes pula-c{40%{transform:translateY(-8px)}}
body.calmo .sprite img{animation:flutua-c 4s ease-in-out infinite}
body.calmo .sprite::after{animation:none}
@keyframes flutua-c{50%{transform:translateY(-6px)}}
@keyframes entra{from{opacity:0;transform:translateY(60px) scale(.6) rotate(-8deg)}60%{opacity:1;transform:translateY(-12px) scale(1.06) rotate(3deg)}to{opacity:1;transform:none}}
body.sem-anim *,body.sem-anim *::after{animation:none!important;transition:none!important}
/* Palco da lição: quem fala, o objeto do objetivo e o balão */
.palco{display:flex;align-items:flex-end;gap:12px}
.palco .bubble{flex:1}
.palco .prop{position:absolute;width:44px;height:44px;left:calc(100% - 22px);top:4%;animation:flutua 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(9,39,77,.18))}
.palco .prop svg{width:100%;height:100%}
.palco .quem{position:relative;flex:none}
@keyframes flutua{50%{transform:translateY(-8px) rotate(6deg)}}
.carinhas{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.carinha{flex:1 1 48px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:28px;line-height:1;background:var(--white);border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;padding:8px 4px}
.carinha small{font-size:12px;font-weight:700;color:var(--muted)}
.carinha.sel{border-color:var(--turq);background:var(--aqua)}
.palco .prop.pop{animation:prop-pop .7s cubic-bezier(.3,1.6,.5,1)}
.reacao{position:absolute;z-index:3;top:-6%;left:-14%;width:86px;height:86px;border-radius:50%;border:4px solid var(--white);box-shadow:0 0 0 3px var(--turq),0 8px 14px rgba(9,39,77,.18);overflow:hidden;background:var(--white);animation:reage .55s cubic-bezier(.3,1.8,.5,1) both}
.reacao.no{box-shadow:0 0 0 3px var(--yellow),0 8px 14px rgba(9,39,77,.18)}
.reacao img{width:100%;height:100%;object-fit:cover}
@keyframes reage{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:none}}
@media (max-width:520px){.reacao{width:64px;height:64px;left:-8%}}
@keyframes prop-pop{40%{transform:scale(1.45) rotate(-12deg)}}
body.calmo .palco .prop{width:30px;height:30px;animation:none;opacity:.85}
@media (max-width:520px){.palco .sprite{--h:200px!important}.palco .prop{width:38px;height:38px}}
/* Brilhos e moedas */
.fx{position:fixed;z-index:60;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;animation:voa 1.1s cubic-bezier(.2,.8,.4,1) both}
.fx svg{width:100%;height:100%}
@keyframes voa{0%{opacity:0;transform:scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg)}}
/* Cena do resultado */
.cena{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:150px}
.cofre{position:relative;width:96px;height:120px;display:flex;align-items:flex-end}
.cofre>svg{width:96px;height:84px;animation:sacode .4s ease 1.4s 2}
.cofre .cai{position:absolute;top:0;width:24px;height:24px;opacity:0;animation:cai .7s cubic-bezier(.5,0,.8,.6) both}
.cofre .cai svg{width:100%;height:100%}
@keyframes cai{0%{opacity:0;transform:translateY(-50px)}20%{opacity:1}85%{opacity:1;transform:translateY(42px) scale(.9)}100%{opacity:0;transform:translateY(48px) scale(.4)}}
@keyframes sacode{50%{transform:rotate(-5deg) scale(1.05)}}
/* Personagens ao lado da trilha, como no mapa */
.trail section{position:relative}
.amigo{position:absolute;top:190px;z-index:1;pointer-events:none}
.amigo.dir{right:2%}.amigo.esq{left:2%}
.amigo .sprite img{height:auto;width:auto;max-height:calc(var(--h) - 10px);max-width:132px}
.amigo .fala{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--white);border:2px solid var(--border);border-radius:12px;padding:3px 10px;font-family:var(--display);font-weight:800;font-size:12px;white-space:nowrap;color:var(--navy);margin-bottom:6px}
/* No celular não cabe ao lado do caminho: o personagem aparece grande, centralizado, depois dos nós de cada objetivo */
@media (max-width:640px){
  .amigo,.amigo.dir,.amigo.esq{position:relative;top:auto;left:auto;right:auto;display:flex;justify-content:center;margin:6px auto 0}
  .amigo .sprite{--h:210px!important}
}
.brand img{height:42px;width:auto}
.brand .ver{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}

/* Lição */
.lesson{position:fixed;inset:0;z-index:20;background:var(--cream);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{max-width:720px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon-btn{border:0;background:none;padding:6px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.icon-btn svg{width:26px;height:26px}
.progress{flex:1;height:16px;background:var(--locked);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.hint{border:2px solid var(--teal);background:var(--aqua);color:var(--teal);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.hint[disabled]{opacity:.4;cursor:default}
.l-body{flex:1;overflow-y:auto}
.l-in{max-width:720px;margin:0 auto;padding-block:8px 28px;display:flex;flex-direction:column;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kind{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.say{display:flex;align-items:flex-end;gap:12px}

/* Avatar: a face da expressão certa para o momento (explicar, pensar, comemorar) */
function av(id,size=56,mood=''){
  const c=CHARS[id]||CHARS.tiko;
  const gold=S&&S.equip&&S.equip.moldura&&id===guideId()?'gold':'';
  return `<div class="av ${mood} ${gold}" style="--c:${c.color};--s:${size}px;width:${size}px;height:${size}px" title="${c.name}">`+
    `<span>${c.name[0]}</span><img src="${ART}${id}-${faceOf(id,mood)}.webp" alt="${c.name}" onerror="this.remove()">${id==='tiko'?accBadges():''}</div>`;
}
/* Figura de corpo inteiro animada. kind: 'full' (figura principal) ou 'pose' (a segunda pose da ficha) */
function sprite(id,h=150,kind='full',cls=''){
  const c=CHARS[id]||CHARS.tiko;if(!c.full)return av(id,Math.round(h*.55),cls.includes('cheer')?'cheer':'');
  return `<div class="sprite ${cls}" style="--h:${h}px;--d:${(.5+Math.random()*2.5).toFixed(2)}s" data-who="${id}" title="${c.name}"><img src="${ART}${id}-${kind==='pose'?c.pose:(c.poses.includes(kind)?kind:c.full)}.webp" alt="${c.name}" onerror="this.closest('.sprite').classList.add('sem-img')">${id==='tiko'?accBadges():''}</div>`;
}
/* Repete uma animação no mesmo elemento */
function anim(el,cls){if(!el)return;el.classList.remove('jump','tilt','pop');void el.offsetWidth;el.classList.add(cls)}
/* Brilhos e moedas que saem de quem fala quando a resposta está certa */
function burst(el,n=6){if(!el||!animOn())return;const r=el.getBoundingClientRect();
  if(calmo())n=2;const tipos=[PROP.brilho,PROP.moeda,PROP.semente,PROP.brilho,PROP.coracao];
  for(let i=0;i<n;i++){const s=document.createElement('i');s.className='fx';s.innerHTML=tipos[i%tipos.length];
    s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height*.35)+'px';
    s.style.setProperty('--dx',(Math.cos(i/n*Math.PI*2-1.2)*(70+Math.random()*40)).toFixed(0)+'px');s.style.setProperty('--dy',(-60-Math.random()*70).toFixed(0)+'px');
    s.style.animationDelay=(i*45)+'ms';document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
/* Cena do resultado: o personagem comemora e as Sementes caem no cofrinho */
function cenaResultado(id,sem){
  const moedas=Math.min(6,Math.max(1,Math.round(sem/2)));
  return `<div class="cena">${comPersonagens()?sprite(id,calmo()?200:300,id==='tiko'?'pose':'full','pop'):''}
    <div class="cofre">${Array.from({length:moedas},(_,i)=>`<i class="cai" style="animation-delay:${.5+i*.18}s;left:${30+((i*17)%40)}%">${PROP.moeda}</i>`).join('')}${PROP.cofrinho}</div></div>`;
}

function simplify(e){
  if(e.type==='choice'&&e.opts.length>2){const w=e.opts.findIndex((o,i)=>i!==e.ans);const keep=[e.ans,w].sort((a,b)=>a-b);return {...e,opts:keep.map(i=>e.opts[i]),ans:keep.indexOf(e.ans)}}
  if(e.type==='sort'&&e.items.length>4){const a=e.items.filter(x=>x[1]===0),b=e.items.filter(x=>x[1]===1);return {...e,items:[a[0],b[0],a[1],b[1]].filter(Boolean)}}
  if(e.type==='match'&&e.pairs.length>3)return {...e,pairs:e.pairs.slice(0,3)};
  if(e.type==='order'&&e.steps.length>4)return null;
  return e;
}
function exFor(lesson,fid){
  const f=fid||faixa().id,out=[];
  lesson.ex.forEach((ex,i)=>{const k=lesson.id+'#'+i;if((SKIP[f]||[]).includes(k))return;
    let e={...ex,...((OV[f]||{})[k]||{})};if(f==='5-7')e=simplify(e);if(e)out.push(e)});
  ((EXTRA[f]||{})[lesson.id]||[]).forEach(e=>{const x=f==='5-7'?simplify(e):e;if(x)out.push(x)});
  return out;
}

let ac;function tone(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.16,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.22);
  o.connect(g).connect(ac.destination);o.start(t+i*.11);o.stop(t+i*.11+.25)})}catch(e){}}

function nivelLinha(l){
  const lic=l.licoes.filter(id=>LESSONS.some(n=>n.id===id));
  const feitas=lic.filter(id=>S.done[id]);if(!feitas.length)return 0;
  const jogadas=feitas.filter(id=>!S.pulou[id]);if(!jogadas.length)return 2; // só pelo nivelamento
  const media=jogadas.reduce((a,id)=>a+(S.acc[id]??0),0)/jogadas.length;
  const unidades=UNITS.filter(u=>u.lessons.some(x=>l.licoes.includes(x.id)));
  const missao=unidades.some(u=>S.missions[u.id]);
  if(feitas.length===lic.length&&media>=80&&missao)return 3;
  if(feitas.length*2>=lic.length&&media>=80)return 2;
  return 1;
}

function glossar(txt){const usados=new Set();
  return txt.replace(GLOS_RE,m=>{const k=GLOS_KEYS.find(x=>x.toLowerCase()===m.toLowerCase());if(!k||usados.has(k)||usados.size>=3)return m;usados.add(k);
    return `<button class="termo" data-act="termo" data-t="${k}" title="O que é ${k}?">${m}</button>`})}
function viewTrilha(){
  const OFF=[0,1,1.5,1,0,-1,-1.5,-1];let k=0;

    return `<div class="node-wrap ${hot?'current':''}" style="transform:translateX(${x}px)">${hot?`<span class="start-tag">${tag}</span>`:''}
      <button class="node ${st}" ${attrs} aria-label="${label}${st==='locked'?' (bloqueada)':''}">${icon}</button><span class="node-label">${label}</span></div>`};
  const nx=nextLesson();
  const units=UV().map((u,ui)=>{
    const quem=cast(u.mission.who),aqui=nx&&nx.u===u;

    const nodes=NODES.map((n,i)=>({n,i})).filter(x=>x.n.u===u).map(({n,i})=>{
      const st=nodeState(n);
      if(n.kind==='grau'){const g=grauDe(n.u),alvo=Math.min(3,Math.max(2,g+1)),d=diasParaOuro(n.u);
        const label=st==='done'?'Ouro conquistado':`Desafio ${GRAUS[alvo]}${st==='wait'?` · abre em ${d} ${d===1?'dia':'dias'}`:''}`;
        const cor=alvo===3||st==='done'?'--u:#E8A317;--ink:#09274D':'--u:#8C9BAB;--ink:#FFFFFF';
        return nodeHtml(st==='wait'?'locked':st,label,st==='locked'||st==='wait'?I.lock:I.medal,`data-act="node" data-i="${i}" style="${cor}"`,GRAUS[alvo].toUpperCase())}
      const icon=st==='locked'?I.lock:(n.kind==='mission'?I.flag:(st==='done'?I.check:I.nodeStar));
      return nodeHtml(st,n.kind==='mission'?'Missão na Vida Real':n.l.title+(S.pulou[n.id]?' · nivelamento':''),icon,`data-act="node" data-i="${i}"`,n.kind==='mission'?'MISSÃO':'COMEÇAR');
    }).join('');
    const nv=NIVEIS_TRILHA[nivelDe(u.id)];
    const nvUnits=nv?nv.units.map(id=>UNITS.find(x=>x.id===id)).filter(unidadeVisivel):[];
    const banda=nv&&nv.units[0]===u.id?`<div class="nivel"><div class="eyebrow">${nivelNome(nv)}${nv.lancamento?' <span class="novo">Novo</span>':''}</div><p>${nv.desc}</p><p class="nivel-prog">${nvUnits.filter(unitLessonsDone).length} de ${nvUnits.length} objetivos alcançados</p></div>`:'';

    return `${banda}<section style="--u:${u.color};--ink:${u.ink}"><div class="unit-head">${S.selos[u.id]?'<span class="selo">Selo conquistado</span>':''}<div class="eb">${ok?'Objetivo alcançado ✓':'Objetivo'}</div><h2>${u.title}</h2><p class="obj">${OBJETIVOS[u.id]||''}</p>${graus}</div><div class="nodes">${nodes}</div>${amigo}</section>`;
  }).join('');
  const futuros=NIVEIS_TRILHA.filter(n=>n.futuro&&nivelVisivel(n));
  const futHtml=futuros.length?`<div class="nivel"><div class="eyebrow">Próximos níveis</div><p>A jornada continua. Um nível novo chega a cada temporada, e tudo o que você conquistou fica com você.</p></div>

  const areas=AREAS.filter(a=>S.owned[a.id]);
  const areaHtml=areas.length?`<section style="--u:#E8A317;--ink:#09274D"><div class="unit-head"><div class="eb">Áreas descobertas</div><h2>Lugares novos do mapa</h2></div><div class="nodes">${

  const pr=UV().filter(u=>grauDe(u)>=2).length,ou=UV().filter(u=>grauDe(u)>=3).length;
  return `${recado}${viewToday()}<div class="trail ${tema}">${units}${areaHtml}${futHtml}
    <div class="card" style="text-align:center"><h3>Até aqui, por enquanto</h3><p>${UV().filter(unitLessonsDone).length} de ${UV().length} objetivos alcançados · ${pr} em Prata · ${ou} em Ouro. Os Desafios Prata e Ouro, as áreas da Loja e a Revisão do dia continuam enquanto os próximos níveis não chegam.</p></div></div>`;

  </div>

  </div>

const regraTotal=()=>POTS.reduce((a,p)=>a+S.regra[p.k],0);
function chart(){
  const h=S.history;if(h.length<2)return '<p style="margin-top:8px">Passe algumas semanas para ver a linha do saldo.</p>';
  const W=560,H=180,l=40,r=90,t=12,bt=28,max=Math.max(10,...h.map(x=>Math.max(x.total,x.dep)));
  const X=i=>l+i/(h.length-1)*(W-l-r),Y=v=>H-bt-v/max*(H-bt-t);
  const line=k=>h.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x[k]).toFixed(1)}`).join('');
  const last=h.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo do Banco por semana"><line x1="${l}" x2="${W-r}" y1="${H-bt}" y2="${H-bt}" stroke="#EADFC9"/>
    <path d="${line('dep')}" fill="none" stroke="#9AA6B5" stroke-width="2" stroke-dasharray="5 4"/><path d="${line('total')}" fill="none" stroke="#0B7A7D" stroke-width="3"/>
    <text x="${X(h.length-1)+6}" y="${Y(last.total)+4}" font-size="12" font-weight="700" fill="#0B7A7D">Banco ${f0(last.total)}</text>
    <text x="${X(h.length-1)+6}" y="${Y(last.dep)+16}" font-size="12" fill="#3D4F66">Guardado ${f0(last.dep)}</text>
    <text x="${l}" y="${H-8}" font-size="11" fill="#3D4F66">semana ${h[0].w}</text><text x="${W-r}" y="${H-8}" font-size="11" fill="#3D4F66" text-anchor="end">semana ${last.w}</text></svg>`;
}

/* ---------- Loja do Club ---------- */
const wishReady=id=>{const w=S.wish[id];return !!w&&(dayAbs()-w.day>=2||Date.now()-w.at>=48*3600e3)};
function viewLoja(){
  const items=SHOP.filter(shopVisible).map(it=>{
    const owned=!!S.owned[it.id];const area=it.kind==='area'?AREAS.find(a=>a.id===it.id):null;const price=shopPrice(it);
    const tikoIcon=`<div class="icon-box" style="position:relative;overflow:visible">${av('tiko',52)}${ACC[it.id]?`<span class="acc"><i>${ACC[it.id]}</i></span>`:''}</div>`;
    const icon=it.kind==='skin'?tikoIcon:it.kind==='tema'?`<div class="icon-box" style="background:${{noite:'#0E2547',praia:'#FCE9BF',floresta:'#DCEFD8'}[it.id]}"></div>`:it.kind==='guia'?av(it.char,56):`<div class="icon-box" style="color:${area.color}">${ico(I.map,34)}</div>`;
    let body='';
    if(owned){
      if(it.kind==='skin'||it.kind==='tema')body=`<button class="sbtn ${S.equip[it.id]?'dark':''}" data-act="equip" data-id="${it.id}">${S.equip[it.id]?'Em uso':'Usar'}</button>`;
      else if(it.kind==='guia')body=`<button class="sbtn ${S.guide===it.char?'dark':''}" data-act="guia" data-c="${it.char}">${S.guide===it.char?'Guiando você':'Escolher como guia'}</button>`;
      else body=`<button class="sbtn" data-act="tab" data-tab="trilha">Ver na trilha</button>`;
    }else if(it.marco){
      body=`<div class="cost">Não está à venda: chega sozinho com ${it.marco} semanas seguidas de Ritmo. Seu Ritmo: ${S.ritmo}.</div>`;
    }else{
      const lockSelo=area&&!S.selos[area.needSelo];
      const n=Math.ceil(price/sonhoSemanal());
      const meta=S.sonhoMeta&&S.sonhoMeta!==it.id?SHOP.find(x=>x.id===S.sonhoMeta):null;
      const cost=meta?`Custo na etiqueta: atrasa seu Sonho (${meta.name}) em cerca de ${n} ${n===1?'semana':'semanas'}.`:`Custo na etiqueta: equivale a ${n} ${n===1?'semana':'semanas'} do seu pote Sonho.`;
      const vista=price>=PARCELA_MIN?Math.round(price*(1-DESCONTO)):price;
      const needWish=price>=WISH_MIN&&!wishReady(it.id);
      body=`<div class="cost">${cost}</div>`;
      if(it.season!==undefined&&it.season!==seasonIdx())body+=`<p class="tagline">Coleção: a temporada dele passou, então custa 50% a mais.</p>`;
      if(lockSelo)body+=`<div class="warn">Precisa do Selo da missão "${UNITS.find(u=>u.id===area.needSelo).title}".</div>`;
      else if(needWish)body+=S.wish[it.id]?`<div class="warn">Na lista de desejos. Pode comprar depois de 2 dias.</div>`:`<p class="tagline">Itens a partir de ${WISH_MIN} esperam 2 dias na lista de desejos. Muitos desejos passam com a espera.</p><button class="sbtn" data-act="wish" data-id="${it.id}">Pôr na lista de desejos</button>`;
      else body+=`<div class="btns" style="margin-top:0"><button class="sbtn pri" data-act="buy" data-id="${it.id}" data-m="vista" ${S.pots.agora<vista?'disabled':''}>${price>=PARCELA_MIN?`À vista ${vista} (−10%)`:`Comprar ${vista}`}</button>${price>=PARCELA_MIN?`<button class="sbtn" data-act="buy" data-id="${it.id}" data-m="parc" ${S.pots.agora<Math.ceil(price/4)?'disabled':''}>4 × ${Math.ceil(price/4)}</button>`:''}</div>${S.pots.agora<vista?`<p class="tagline">Faltam ${f0(vista-S.pots.agora)} no pote Agora. Dá para tirar do Cofrinho no Banco.</p>`:''}`;
      if(price>=WISH_MIN)body+=`<button class="sbtn ${S.sonhoMeta===it.id?'dark':''}" data-act="meta" data-id="${it.id}">${S.sonhoMeta===it.id?'É o meu Sonho':'Tornar meu Sonho'}</button>`;
    }
    const kind={skin:'Skin',tema:'Tema da trilha',guia:'Personagem',area:'Área a descobrir'}[it.kind]+(it.marco?' · marco do Ritmo':it.season!==undefined?' · temporada':'');
    return `<div class="item ${owned?'owned':''}"><div class="top">${icon}<div><div class="kind">${kind}</div><h4>${it.name}</h4></div></div><p class="tagline">${it.tag}</p>${owned||it.marco?'':`<div class="price">${ico(I.seed,20)} ${price}</div>`}${body}</div>`;
  }).join('');
  return `<div class="card"><div class="eyebrow">Loja do Club</div><h3>Você tem ${f0(S.pots.agora)} Sementes no pote Agora</h3><p>Aqui só se gasta o pote Agora. Nada na Loja dá vantagem na trilha, e Sementes nunca são vendidas por dinheiro de verdade.</p></div><div class="shop">${items}</div>`;
}

};

function buy(id,mode){
  const it=SHOP.find(x=>x.id===id),price=shopPrice(it);
  if(mode==='parc'){const v=Math.ceil(price/4);if(S.pots.agora<v)return;S.pots.agora-=v;S.parcelas.push({name:it.name,valor:v,restantes:3})}
  else{const v=price>=PARCELA_MIN?Math.round(price*(1-DESCONTO)):price;if(S.pots.agora<v)return;S.pots.agora-=v}
  S.owned[id]=true;delete S.wish[id];if(S.sonhoMeta===id)S.sonhoMeta=null;
  if(it.kind==='skin')S.equip[id]=true;if(it.kind==='tema'){['noite','praia','floresta'].forEach(t=>S.equip[t]=false);S.equip[id]=true}if(it.kind==='guia')S.guide=it.char;
  save();render();tone(true);
  toast(mode==='parc'?`${it.name} é seu. Faltam 3 parcelas; parcelando, pagou ${Math.ceil(price/4)*4-Math.round(price*(1-DESCONTO))} a mais do que à vista.`:`${it.name} é seu.`);
}

/* ---------- Dia da Mesada: divisão nos potes ---------- */
function askSplit(total,reason,then){
  total=Math.round(total);if(total<=0){then&&then();return}
  const v={};let used=0;POTS.forEach(p=>{v[p.k]=Math.floor(total*S.regra[p.k]/100);used+=v[p.k]});v.agora+=total-used;
  const m=modal('');
  const draw=()=>{const sum=POTS.reduce((a,p)=>a+v[p.k],0);
    m.firstChild.innerHTML=`<div class="eyebrow">${reason}</div><h2>${total} Sementes para dividir</h2><p>Sua regra dos potes já preencheu a divisão. Mude se quiser.</p>
      ${POTS.map(p=>`<div class="rule-row"><span><b style="color:${p.c==='#FFC12E'?'var(--navy)':p.c};min-width:0;text-align:left">${p.name}</b></span><span class="stepper"><button data-s="${p.k}" data-d="-1" aria-label="Menos">−</button><b>${v[p.k]}</b><button data-s="${p.k}" data-d="1" aria-label="Mais">+</button></span></div>`).join('')}
      <div class="row-sb"><span>${sum===total?'Tudo dividido':(sum<total?`Faltam ${total-sum}`:`Passou ${sum-total}`)}</span><span>${dobro()?'Semana do Dobro: o Compartilhar vale 2×':'Sonho vai para o Cofrinho; Reserva para a Árvore'}</span></div>
      <div class="row"><button class="btn" id="sp-ok" ${sum!==total?'disabled':''}>Confirmar divisão</button></div>`;
    m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s,nv=v[k]+(+b.dataset.d);if(nv<0)return;v[k]=nv;draw()});
    m.querySelector('#sp-ok').onclick=()=>{S.pots.agora+=v.agora;S.pots.reserva+=v.reserva;S.bank.cofrinho+=v.sonho;S.bank.depositado+=v.reserva+v.sonho;
      S.mutirao.meu+=v.compartilhar;addMutirao(v.compartilhar*(dobro()?2:1));save();m.remove();render();then&&then()};
  };draw();
}
function addMutirao(x){const m=S.mutirao;m.total+=x;while(m.total>=m.meta){m.total-=m.meta;m.nivel++;m.meta*=2;S.estrelas+=20;toast('Mutirão fechado! A família inteira ganhou a Bandeira e 20 Estrelas.')}}

/* ---------- Modo piloto: os dias passam pelo relógio ----------
   Por padrão o jogo roda como no piloto: sem botões de teste, e cada dia do calendário é um dia do jogo
   (a semana do jogo tem 7 dias a partir do primeiro dia em que a família abriu o jogo).
   Para testar, toque 5 vezes no "Trilha v2.5" do topo: liga o modo de teste só neste aparelho. */
const DIA_MS=86400000;
const piloto=()=>!S.teste;
const hojeLocal=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const dataDoDia=abs=>new Date((S.inicio||hojeLocal())+(abs-1)*DIA_MS);
const dm=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
let sincronizando=false;
function sincronizarTempo(){
  if(!piloto()||!S.faixa||sincronizando||document.querySelector('.modal'))return;
  if(!S.inicio){S.inicio=hojeLocal()-(dayAbs()-1)*DIA_MS;save();return}
  const alvo=Math.max(1,Math.round((hojeLocal()-S.inicio)/DIA_MS)+1);
  if(alvo<=dayAbs())return;
  const semanaAlvo=Math.floor((alvo-1)/7)+1,diaAlvo=(alvo-1)%7+1;
  if(semanaAlvo===S.week){S.day=diaAlvo;save();render();return}
  sincronizando=true;
  // semanas inteiras longe do jogo: passam em silêncio; a última mostra o resumo e a divisão da Mesada
  while(S.week<semanaAlvo-1)advanceWeek({silencio:true});
  sincronizando=false;
  advanceWeek({dia:diaAlvo});
}
function alternarTeste(){
  S.teste=!S.teste;
  if(!S.teste)S.inicio=hojeLocal()-(dayAbs()-1)*DIA_MS; // volta para o relógio a partir do dia atual do jogo
  save();render();toast(S.teste?'Modo de teste ligado neste aparelho: os botões de tempo voltaram.':'Modo piloto: os dias passam pelo calendário.');
}
let toquesVer=0,toqueT=0;
document.addEventListener('click',e=>{if(!e.target.closest('.brand .ver'))return;const t=Date.now();toquesVer=t-toqueT<1500?toquesVer+1:1;toqueT=t;if(toquesVer>=5){toquesVer=0;alternarTeste()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizarTempo()});
setInterval(sincronizarTempo,60000);

/* Resumo da semana para o piloto: sem nome e sem dado pessoal, só o que o roteiro do piloto pede */
function resumoSemana(){
  const f=faixa(),ini=dataDoDia((S.week-1)*7+1),fim=dataDoDia(S.week*7);
  const feitas=LESSONS.filter(n=>S.done[n.id]).length;
  const mis=UV().filter(u=>S.missions[u.id]);
  const minSemana=Array.from({length:7},(_,i)=>S.tempo[(S.week-1)*7+i+1]||0).reduce((a,b)=>a+b,0);
  const compras=SHOP.filter(it=>S.owned[it.id]).map(it=>it.name+(it.marco?' (prêmio)':''));
  const div=S.diversao[S.week-1];
  return [
    'Missão Dinheiro Club · resumo da semana',
    `Família: ${S.codigo||'(sem código)'} · Faixa: ${f.name}${S.perfil?' · Perfil: '+({teen:'adolescente',adulto:'adulto',resp:'responsável'})[S.perfil]:''}`,
    `Semana do jogo: ${S.week} (${dm(ini)} a ${dm(fim)}) · ${piloto()?'modo piloto':'MODO DE TESTE'}`,
    `Dias de prática nesta semana: ${diasPratica()} · Meta: ${S.ritmoMeta} dias · Ritmo: ${S.ritmo} (recorde ${S.recorde})`,
    `Lições feitas: ${feitas} de ${LESSONS.length} (${Math.max(0,feitas-S.licoesIni)} nesta semana) · Tempo estimado nesta semana: ${minSemana} min`,
    `Objetivos alcançados: ${UV().filter(unitLessonsDone).length} de ${UV().length} · Prata: ${UV().filter(u=>grauDe(u)>=2).length} · Ouro: ${UV().filter(u=>grauDe(u)>=3).length}`,
    `Missões na Vida Real: ${mis.length} (${mis.filter(u=>S.missions[u.id]==='familia').length} em família, ${mis.filter(u=>S.missions[u.id]==='solo').length} sozinho)${mis.length?' · '+mis.map(u=>u.mission.nome).join('; '):''}`,
    `Regra dos potes: Agora ${S.regra.agora}% · Reserva ${S.regra.reserva}% · Sonho ${S.regra.sonho}% · Compartilhar ${S.regra.compartilhar}% · mudou ${S.regraMudou} ${S.regraMudou===1?'vez':'vezes'}`,
    `Sementes: Agora ${f0(S.pots.agora)} · Reserva ${f1(S.pots.reserva)} · Sonho ${f1(sonhoTotal())} (Cofrinho ${f1(S.bank.cofrinho)}, Árvore ${f1(S.bank.arvore)}, Escada ${f1(lotsSum())}) · Compartilhadas ${f0(S.mutirao.meu)} · A receber ${f0(S.aReceber)}`,
    `Juros recebidos no total: ${fj(S.bank.juros)} Sementes`,
    `Compras e prêmios: ${compras.length?compras.join('; '):'nenhum'}`,
    `Diversão na semana anterior (1 a 5): ${div||'não respondida'}`,
    `Pergunta da semana: "${PERGUNTA[(nextLesson()||LESSONS[LESSONS.length-1]).u.id]||''}"`
  ].join('\n');
}

    <label style="display:flex;flex-direction:column;gap:6px;font-weight:600">Código da família (o que a equipe do piloto passou, por exemplo F07). Não use nomes.

function copiarResumo(){
  const txt=resumoSemana(),ta=document.getElementById('resumo-txt');
  const ok=()=>toast('Resumo copiado. Cole no formulário do diário semanal.');
  const manual=()=>{if(ta){ta.focus();ta.select()}toast('Selecionei o texto: use Copiar do seu aparelho.')};
  const antigo=()=>{if(!ta)return manual();ta.focus();ta.select();try{document.execCommand('copy')?ok():manual()}catch(e){manual()}};
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,antigo);else antigo()}catch(e){antigo()}
}

/* ---------- Tempo: dias e semanas ---------- */
function nextDay(){
  if(S.day>=7)return advanceWeek();
  S.day++;save();render();toast(`Dia ${S.day} da semana ${S.week}.`);
}
function advanceWeek(o={}){
  if(o&&o.type)o={}; // chamado por um clique: sem opções
  const ev=[];const b=S.bank;const feitos=diasPratica();
  // Ritmo da Semana, com meta escolhida e marcos
  if(feitos>=S.ritmoMeta){S.ritmo++;S.recorde=Math.max(S.recorde,S.ritmo);receber(RITMO_BONUS[S.ritmoMeta],'Bônus do Ritmo');ev.push(`Meta de ${S.ritmoMeta} dias batida: Ritmo de ${S.ritmo===1?'1 semana':S.ritmo+' semanas seguidas'} e ${RITMO_BONUS[S.ritmoMeta]} Sementes de bônus.`);
    MARCOS.forEach(mk=>{if(S.ritmo>=mk&&!S.marcos[mk]){S.marcos[mk]=true;const it=SHOP.find(x=>x.marco===mk);S.owned[it.id]=true;if(it.kind==='skin')S.equip[it.id]=true;ev.push(`Marco de ${mk} semanas: você ganhou ${it.name}.`)}})}
  else if(S.ritmo>0&&S.descanso>0){S.descanso--;ev.push(`Foram ${feitos} de ${S.ritmoMeta} dias: a folga da temporada segurou o seu Ritmo.`)}
  else if(S.ritmo>0){S.ritmo=0;ev.push(`Nova semana, novo começo. O Ritmo recomeça; seu recorde de ${S.recorde} fica guardado.`)}
  else ev.push(`Esta semana teve ${feitos} de ${S.ritmoMeta} dias de prática.`);
  S.semanasSemJogar=feitos?0:S.semanasSemJogar+1;
  // Colheita da Árvore a cada 4 semanas (com teto da faixa)
  const tree=b.arvore+S.pots.reserva;
  if(S.week%4===0&&tree>0){const base=Math.min(tree,Math.max(0,teto()-lotsSum()));const j=base*ARV_MES;
    b.arvore+=j*(b.arvore/tree);S.pots.reserva+=j*(S.pots.reserva/tree);b.juros+=j;ev.push(`Colheita da Árvore: ${fj(j)} Sementes de juros sobre ${f1(tree)}.`)}
  // Rega automática
  if(S.rega){const x=Math.min(S.rega,S.pots.agora);if(x>0){S.pots.agora-=x;b.arvore+=x;b.depositado+=x;ev.push(`Rega automática: ${f0(x)} Sementes do Agora foram para a Árvore.`)}}
  // Conserto que ficou esperando
  if(S.conserto){if(S.pots.agora>=S.conserto.valor){S.pots.agora-=S.conserto.valor;ev.push(`Conserto pago: ${S.conserto.nome}, ${S.conserto.valor} Sementes.`);S.conserto=null}else ev.push(`O conserto (${S.conserto.nome}) continua esperando: faltam Sementes no Agora.`)}
  // Parcelas
  S.parcelas.forEach(p=>{if(S.pots.agora>=p.valor){S.pots.agora-=p.valor;p.restantes--;ev.push(`Parcela de ${p.valor} paga (${p.name}).`)}else ev.push(`Parcela de ${p.name} esperando: falta Semente no Agora.`)});
  S.parcelas=S.parcelas.filter(p=>p.restantes>0);
  // Mutirão simulado
  S.mutirao.familia+=18;addMutirao(18);ev.push('A família simulada doou 18 Sementes ao Mutirão.');
  const imprev=S.week%4===3?IMPREVISTOS[Math.floor(S.week/4)%IMPREVISTOS.length]:null;
  S.week++;S.day=(o.dia&&!o.silencio)?o.dia:1;S.dias={};S.licoesIni=LESSONS.filter(n=>S.done[n.id]).length;
  if((S.week-1)%8===0){S.descanso=1;ev.push(`Começou a ${SEASONS[seasonIdx()].nome}: item exclusivo na Loja.`)}
  const due=b.lots.filter(l=>l.end<=S.week);b.lots=b.lots.filter(l=>l.end>S.week);
  if(due.length)ev.push(`${due.length} plantio${due.length>1?'s':''} da Escada pronto${due.length>1?'s':''} para colher.`);
  const mesada=S.aReceber;S.aReceber=0;const log=S.receberLog.slice();S.receberLog=[];
  S.history.push({w:S.week,total:bancoTotal()+due.reduce((a,l)=>a+l.v,0),dep:b.depositado});
  if(o.silencio){
    // semana em que a família não abriu o jogo: tudo é resolvido sem perguntar e entra no resumo da volta
    due.forEach(l=>{const j=l.v*ESCADA[l.prazo];b.juros+=j;b.cofrinho+=l.v+j;ev.push(`Plantio de ${l.prazo} semanas colhido para o Cofrinho: ${f1(l.v+j)}.`)});
    if(imprev){const [nome,v]=imprev;if(S.pots.reserva>=v){S.pots.reserva-=v;ev.push(`Imprevisto (${nome}) pago com a Reserva.`)}else if(S.pots.agora>=v){S.pots.agora-=v;ev.push(`Imprevisto (${nome}) pago com o Agora.`)}else{S.conserto={nome,valor:v+5};ev.push(`Imprevisto (${nome}) ficou para depois: ${v+5} Sementes.`)}}
    if(mesada>0){const v={};let used=0;POTS.forEach(p=>{v[p.k]=Math.floor(mesada*S.regra[p.k]/100);used+=v[p.k]});v.agora+=mesada-used;
      S.pots.agora+=v.agora;S.pots.reserva+=v.reserva;b.cofrinho+=v.sonho;b.depositado+=v.reserva+v.sonho;S.mutirao.meu+=v.compartilhar;addMutirao(v.compartilhar);
      ev.push(`${nomeMesada()}: ${Math.round(mesada)} Sementes divididas pela sua regra dos potes.`)}
    S.foraLog.push(...ev.map(x=>`Semana ${S.week-1}: ${x}`));save();return;
  }
  const fora=S.foraLog.splice(0);
  save();render();
  const semanaQueAcabou=S.week-1;
  const m=modal(`<div class="say">${av(guideId(),64)}<div class="bubble"><span class="who">${CHARS[guideId()].name}</span>${fora.length?'Que bom te ver! Enquanto você esteve fora, o tempo do jogo andou:':`Começou a semana ${S.week}. Olha o que aconteceu:`}</div></div>
    ${fora.length?`<ul>${fora.map(x=>`<li>${x}</li>`).join('')}</ul><p style="font-size:13px">Nada foi perdido: o que você conquistou continua aqui.</p>`:''}
    <ul>${ev.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="mission" id="wk-div"><div class="eyebrow">Uma pergunta rápida</div><b>Quanto você se divertiu no jogo na semana ${semanaQueAcabou}?</b>
      <div class="carinhas" role="group" aria-label="De 1 a 5">${['😞','🙁','😐','🙂','😄'].map((c,i)=>`<button class="carinha ${S.diversao[semanaQueAcabou]===i+1?'sel':''}" data-div="${i+1}" aria-label="${i+1} de 5">${c}<small>${i+1}</small></button>`).join('')}</div></div>
    <div class="row"><button class="btn" id="wk-ok">Continuar</button></div>`);
  m.querySelectorAll('[data-div]').forEach(bt=>bt.onclick=()=>{S.diversao[semanaQueAcabou]=+bt.dataset.div;save();m.querySelectorAll('.carinha').forEach(x=>x.classList.toggle('sel',x===bt))});
  m.querySelector('#wk-ok').onclick=()=>{m.remove();harvest(due,()=>imprevisto(imprev,()=>askSplit(mesada,`${nomeMesada()} · ${log.length} ganhos da semana`)))};
}
function imprevisto(im,then){
  if(!im)return then&&then();
  const [nome,v]=im;
  const m=modal(`<div class="say">${av(guideId(),64)}<div class="bubble"><span class="who">${CHARS[guideId()].name}</span>Opa, apareceu um imprevisto! Qual opção protege o seu plano?</div></div>
    <div class="mission"><div class="eyebrow">Imprevisto</div>${nome}. O conserto custa ${v} Sementes.</div>
    <button class="choice" data-i="res" ${S.pots.reserva<v?'disabled':''}><b>Pagar com a Reserva</b><span>${S.pots.reserva<v?`A Reserva tem só ${f1(S.pots.reserva)}.`:'É para isso que ela existe.'}</span></button>
    <button class="choice" data-i="agora" ${S.pots.agora<v?'disabled':''}><b>Pagar com o pote Agora</b><span>${S.pots.agora<v?`O Agora tem só ${f0(S.pots.agora)}.`:'Sai do que você ia gastar na Loja.'}</span></button>
    <button class="choice" data-i="esperar"><b>Esperar e pagar depois</b><span>O conserto fica mais caro: ${v+5} Sementes na próxima semana. Esse é o custo de não ter Reserva.</span></button>`);
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const c=b.dataset.i;
    if(c==='res'){S.pots.reserva-=v;S.bank.depositado=Math.max(0,S.bank.depositado-v);toast('Pago com a Reserva. O plano continua de pé.')}
    else if(c==='agora'){S.pots.agora-=v;toast('Pago com o Agora.')}
    else{S.conserto={nome,valor:v+5};toast(`Conserto marcado para a próxima semana: ${v+5} Sementes.`)}
    save();m.remove();render();then&&then()});
}
function harvest(list,then){
  if(!list.length)return then&&then();
  const l=list[0],r=ESCADA[l.prazo],j=l.v*r,k=Math.floor(52/l.prazo);
  const comp=l.v*Math.pow(1+r,k),simp=l.v+l.v*r*k;
  S.bank.juros+=j;save();
  const meta=S.sonhoMeta?SHOP.find(x=>x.id===S.sonhoMeta):null;
  const daSonho=meta&&l.v+j+S.pots.agora+S.bank.cofrinho+S.bank.arvore>=shopPrice(meta);
  const m=modal(`<div class="eyebrow">Colheita · plantio de ${l.prazo} semanas</div><h2>${f1(l.v)} viraram ${f1(l.v+j)}</h2>
    <p>Rendeu ${fj(j)} Sementes de juros. O que fazer agora?</p>
    ${daSonho?`<div class="mission"><div class="eyebrow">Seu Sonho está ao alcance</div>Colhendo tudo, você já tem o suficiente para ${meta.name}. Replantar adia o Sonho por mais ${l.prazo} semanas.</div>`:''}
    <button class="choice" data-h="all"><b>Replantar tudo por mais ${l.prazo} semanas</b><span>Os juros passam a render juros. Replantando sempre, em um ano isto vira cerca de ${f0(comp)}.</span></button>
    <button class="choice" data-h="juros"><b>Colher só os juros e replantar o resto</b><span>${fj(j)} vão para o pote Agora. Fazendo isso sempre, em um ano o plantio mais os juros colhidos somam cerca de ${f0(simp)}: são juros simples, porque os juros não voltam a render.</span></button>
    <button class="choice" data-h="tudo"><b>Colher tudo para o Cofrinho</b><span>${f1(l.v+j)} ficam no Cofrinho, sem render e prontos para usar.</span></button>`);
  const replant=v=>{const room=Math.max(0,teto()-(S.bank.arvore+S.pots.reserva+lotsSum()));const x=Math.min(v,room);
    if(x>0)S.bank.lots.push({id:S.nextLot++,v:x,prazo:l.prazo,start:S.week,end:S.week+l.prazo});if(v-x>0){S.bank.cofrinho+=v-x;toast('Parte foi para o Cofrinho: o teto da faixa não deixa mais Sementes rendendo.')}};
  m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const h=b.dataset.h;
    if(h==='all')replant(l.v+j);else if(h==='juros'){S.pots.agora+=j;replant(l.v)}else S.bank.cofrinho+=l.v+j;
    save();m.remove();render();harvest(list.slice(1),then)});
}

/* ---------- Pergunta do dia ---------- */
function perguntaDoDia(){
  if(S.perguntaDia===dayAbs())return;
  const pool=[];const dev=revisoesDevidas();
  (dev.length?dev:LESSONS.filter(n=>S.done[n.id])).forEach(n=>exFor(n.l).forEach(ex=>{if(ex.type==='choice')pool.push(ex)}));
  if(!pool.length)exFor(UNITS[0].lessons[0]).forEach(ex=>{if(ex.type==='choice')pool.push(ex)});
  const ex=pool[dayAbs()%pool.length],who=cast(ex.who);
  const m=modal(`<div class="eyebrow">Pergunta do dia</div><div class="say">${av(who,56)}<div class="bubble"><span class="who">${CHARS[who].name}</span>${ex.q}</div></div>
    <div class="opts">${ex.opts.map((o,i)=>`<button class="opt" data-q="${i}"><span class="k">${i+1}</span>${o}</button>`).join('')}</div><div id="pq-f"></div>`);
  m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.q===ex.ans;tone(ok);
    m.querySelectorAll('[data-q]').forEach((x,i)=>{x.disabled=true;if(i===ex.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    S.perguntaDia=dayAbs();markPractice();receber(2,'Pergunta do dia');S.tempo[dayAbs()]=tempoHoje()+MIN_PERGUNTA;save();

function nivelamento(){

let L=null;

function nextEx(){

    <div class="palco">${comPersonagens()?`<div class="quem">${calmo()?av(who,80):sprite(who,280,(CHARS[who].poses||['full'])[L.doneCount%4])}${PROP_UNIT[L.unit&&L.unit.id]?`<span class="prop" aria-hidden="true">${PROP[PROP_UNIT[L.unit.id]]}</span>`:''}</div>`:''}<div class="bubble"><span class="who">${CHARS[who].name}</span>${glossar(ex.q)}</div></div><div id="ex"></div>`;
  ({choice:rChoice,sort:rSort,match:rMatch,order:rOrder,split:rSplit})[ex.type](ex);

function updHint(){const h=$('#l-hint');if(h){h.textContent=`${dicaName()} · ${L.hints}`;h.disabled=!L.hints||L.state.checked}}
function footCheck(){const f=$('#l-f');f.className='l-foot';f.innerHTML='<div class="f-in"><button class="btn" id="chk" disabled>Verificar</button></div>';$('#chk').onclick=check}
const ready=v=>{const b=$('#chk');if(b)b.disabled=!v};

function rChoice(ex){
  $('#ex').innerHTML=`<div class="opts">${ex.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o}</button>`).join('')}</div>`;

    if(!w)return false;w.classList.add('off');w.classList.remove('sel');w.disabled=true;if(L.state.answer===+w.dataset.i){L.state.answer=null;ready(false)}return true};

function rSort(ex){
  L.state.answer=ex.items.map(()=>null);
  $('#ex').innerHTML=`<div class="opts">${ex.items.map((it,i)=>`<div class="sort-row" data-r="${i}"><b>${it[0]}</b><div class="seg">${ex.buckets.map((bk,j)=>`<button data-i="${i}" data-j="${j}">${bk}</button>`).join('')}</div></div>`).join('')}</div>`;
  const pick=(i,j)=>{L.state.answer[i]=j;$('#ex').querySelectorAll(`[data-i="${i}"]`).forEach(x=>x.classList.toggle('sel',+x.dataset.j===j));ready(L.state.answer.every(v=>v!==null))};
  $('#ex').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{if(!L.state.checked)pick(+b.dataset.i,+b.dataset.j)});
  L.state.hint=()=>{const i=ex.items.findIndex((it,k)=>L.state.answer[k]!==it[1]);if(i<0)return false;pick(i,ex.items[i][1]);$('#ex').querySelector(`[data-r="${i}"]`).classList.add('hinted');return true};
}
function rOrder(ex){
  L.state.answer=[];const bank=shuffle(ex.steps.map((s,i)=>i));
  const draw=()=>{
    $('#ex').innerHTML=`<div class="order-line">${L.state.answer.map((i,p)=>`<button class="step" data-out="${p}"><span class="n">${p+1}</span>${ex.steps[i]}</button>`).join('')}</div>
      <div class="bank-steps">${bank.map(i=>`<button class="step ${L.state.answer.includes(i)?'ghost':''}" data-in="${i}">${ex.steps[i]}</button>`).join('')}</div>`;
    $('#ex').querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{if(L.state.checked)return;L.state.answer.push(+b.dataset.in);draw()});
    $('#ex').querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{if(L.state.checked)return;L.state.answer.splice(+b.dataset.out,1);draw()});
    ready(L.state.answer.length===ex.steps.length);
  };draw();
  L.state.hint=()=>{let k=0;while(k<L.state.answer.length&&L.state.answer[k]===k)k++;if(k>=ex.steps.length)return false;
    L.state.answer=Array.from({length:k+1},(_,i)=>i);draw();return true};
}
function rSplit(ex){
  L.state.answer=ex.jars.map(()=>0);
  const draw=()=>{
    const used=L.state.answer.reduce((a,b)=>a+b,0),left=ex.total-used;
    $('#ex').innerHTML=`<div class="jars">${ex.jars.map((j,i)=>`<div class="jar"><h4>${j}</h4><div class="val">R$ ${L.state.answer[i]}</div>
      <div class="fill"><i style="width:${L.state.answer[i]/ex.total*100}%"></i></div>
      <div class="ctl"><button data-m="${i}" aria-label="Tirar de ${j}">−</button><button data-p="${i}" aria-label="Pôr em ${j}">+</button></div></div>`).join('')}</div>
      <div class="left">${left?`Faltam R$ ${left} para distribuir`:'Tudo distribuído'}</div><div class="rule">${ex.need}</div>`;
    $('#ex').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(L.state.checked||left<ex.step)return;L.state.answer[+b.dataset.p]+=ex.step;draw()});
    $('#ex').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(L.state.checked||!L.state.answer[i])return;L.state.answer[i]-=ex.step;draw()});
    ready(left===0);
  };draw();
  L.state.hint=()=>{L.state.answer=ex.hintVals.slice();draw();return true};
}
function rMatch(ex){
  const right=shuffle(ex.pairs.map((p,i)=>i));let pick=null,matched=0;
  $('#ex').innerHTML=`<div class="match"><div class="col">${ex.pairs.map((p,i)=>`<button class="tile" data-l="${i}">${p[0]}</button>`).join('')}</div>
    <div class="col">${right.map(i=>`<button class="tile" data-r="${i}">${ex.pairs[i][1]}</button>`).join('')}</div></div>`;
  const ls=$('#ex').querySelectorAll('[data-l]');
  const done=i=>{const l=$('#ex').querySelector(`[data-l="${i}"]`),r=$('#ex').querySelector(`[data-r="${i}"]`);
    [l,r].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});pick=null;matched++;if(matched===ex.pairs.length){L.state.answer=true;check()}};
  ls.forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;ls.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=+b.dataset.l});
  $('#ex').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok')||pick===null)return;
    if(+b.dataset.r===pick)done(pick);else{b.classList.add('bad');L.state.slip=true;setTimeout(()=>b.classList.remove('bad'),350)}});
  $('#l-f').className='l-foot';$('#l-f').innerHTML='<div class="f-in"><span style="color:var(--muted);font-size:14px">Toque numa palavra e depois no significado.</span></div>';
  L.state.hint=()=>{const i=ex.pairs.findIndex((p,k)=>!$('#ex').querySelector(`[data-l="${k}"]`).classList.contains('ok'));if(i<0)return false;done(i);return true};
}
function useHint(){

}
function check(){
  const st=L.state,ex=st.ex;if(st.checked)return;st.checked=true;
  let ok;
  if(ex.type==='choice'){ok=st.answer===ex.ans;$('#ex').querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===ex.ans)b.classList.add('right');else if(i===st.answer)b.classList.add('wrong')})}
  else if(ex.type==='sort'){ok=ex.items.every((it,i)=>st.answer[i]===it[1]);$('#ex').querySelectorAll('.sort-row').forEach((r,i)=>r.classList.add(st.answer[i]===ex.items[i][1]?'right':'wrong'))}

  {const q=document.querySelector('#l-in .palco .quem');const sp=q&&(q.querySelector('.sprite')||q.querySelector('.av'));
   if(sp&&sp.classList.contains('sprite'))anim(sp,ok?'jump':'tilt');else if(sp){sp.classList.remove('cheer','oops');void sp.offsetWidth;sp.classList.add(ok?'cheer':'oops')}
   if(ok)burst(sp);const pr=q&&q.querySelector('.prop');if(pr&&ok)anim(pr,'pop');
   // a face com a expressão do momento aparece num balãozinho ao lado do corpo
   if(q&&sp&&sp.classList.contains('sprite')){q.querySelector('.reacao')?.remove();const id=sp.dataset.who;
     q.insertAdjacentHTML('beforeend',`<span class="reacao ${ok?'ok':'no'}"><img src="${ART}${id}-${faceOf(id,ok?'cheer':'oops')}.webp" alt=""></span>`)}}
  const g=guideId();

  let exp=ex.exp;
  if(!ok&&ex.type==='order')exp='A ordem é: '+ex.steps.join(' → ')+'. '+ex.exp;
  if(!ok&&ex.type==='split')exp=ex.need+' Dá para tentar de novo daqui a pouco.';
  const f=$('#l-f');f.className='l-foot '+(ok?'ok':'no');
  f.innerHTML=`<div class="f-in"><div class="f-msg">${av(g,52,ok?'cheer':'oops')}<div><h3>${ok?sayOk:'Ainda não.'}</h3><p>${exp}${ok?'':' Errar não custa nada: essa volta no fim da lição.'}</p></div></div><button class="btn" id="go">Continuar</button></div>`;
  $('#go').onclick=nextEx;$('#go').focus();
}
/* Desafios de grau: Prata aplica em casos novos com menos Dicas; Ouro mistura com objetivos anteriores, depois de 7 dias */
const misturar=e=>{if(e.type!=='choice')return e;const ord=shuffle(e.opts.map((_,i)=>i));return {...e,opts:ord.map(i=>e.opts[i]),ans:ord.indexOf(e.ans)}};
function grauEx(u,g){
  // Na faixa 5 a 7, a Base segue remixando as lições já simplificadas para quem está aprendendo a ler
  const base=['c5','c2','u1','c3','u2','u3','u4','u6','c4','u5','c1','c11','c12','c14','c16'].includes(u.id);
  const own=!(faixa().id==='5-7'&&base)&&(GRAU_EX[u.id]||{})[g];if(own)return own.map(misturar);
  const pool=shuffle(u.lessons.filter(visivel).flatMap(l=>exFor(l)));
  if(g===2)return pool.slice(0,6).map(misturar);
  const antes=UV().slice(0,UV().indexOf(u)).filter(unitLessonsDone).flatMap(x=>x.lessons.filter(visivel)).flatMap(l=>exFor(l)).filter(e=>e.type==='choice');
  return shuffle(pool.slice(0,4).concat(shuffle(antes).slice(0,2))).map(misturar);
}
function startGrau(u,g,treino){
  const kids=faixa().id==='5-7';
  startLesson({id:`grau${g}-${u.id}`,title:`Desafio ${GRAUS[g]}: ${u.title}`,ex:grauEx(u,g),grau:g,unitId:u.id,hints:g===2?(kids?2:1):(kids?1:0)},u,treino);
}
function finishGrau(){
  const {lesson,practice}=L,g=lesson.grau,u=UNITS.find(x=>x.id===lesson.unitId);
  const acc=Math.round(L.firstTry/L.total*100),passou=acc>=GRAU_MIN,novo=!practice&&passou&&grauDe(u)<g;
  const est=novo?(g===2?15:20):5,sem=novo?(g===2?10:15):3;
  S.estrelas+=est;markPractice();receber(sem,novo?`Grau ${GRAUS[g]}: ${u.title}`:'Treino');S.tempo[dayAbs()]=tempoHoje()+MIN_LICAO;
  if(novo){S.grau[u.id]=g;S.grauDia[u.id]=dayAbs()}
  save();$('#lesson').remove();L=null;
  const msg=novo?(g===2?`Você aplicou o objetivo "${OBJETIVOS[u.id]}" em casos novos. O Desafio Ouro abre em ${OURO_DIAS} dias: ele vê o que ficou na memória.`
      :'Você lembrou depois de uma semana e usou em outro contexto. Isso é domínio de verdade.')
    :passou?'Treino feito. Repetir o que já domina mantém tudo fresco.'
    :`Você acertou ${acc}% de primeira, e o grau pede ${GRAU_MIN}%. Dá para tentar de novo quando quiser, sem perder nada do que já conquistou.`;
  document.body.insertAdjacentHTML('beforeend',`<div class="result" id="res"><div class="r-in">${cenaResultado(guideId(),sem)}
    <div class="graus big">${[1,2,3].map(k=>`<span class="g${k} ${grauDe(u)>=k?'on':''}">${GRAUS[k]}</span>`).join('')}</div>
    <h2>${novo?`${GRAUS[g]} conquistado!`:passou?'Desafio feito!':'Quase lá!'}</h2>
    <p style="margin:0;color:var(--muted)">${msg}</p>
    <div class="tiles"><div class="tile-s" style="--tc:#2F6FD6;--tk:#fff"><small>Estrelas</small><b>+${est}</b></div>
      <div class="tile-s" style="--tc:var(--teal);--tk:#fff"><small>Precisão</small><b>${acc}%</b></div>
      <div class="tile-s" style="--tc:#2E8B57;--tk:#fff"><small>Sementes</small><b>+${sem}</b></div></div>
    <button class="btn" id="res-go" style="margin:8px auto 0;min-width:220px">Continuar</button></div></div>`);
  setTimeout(()=>burst(document.querySelector('#res .sprite'),10),750);$('#res-go').onclick=()=>{$('#res').remove();render()};$('#res-go').focus();
}
function finishLesson(){
  if(L.lesson.grau)return finishGrau();
  const {lesson,practice}=L;
  const acc=Math.round(L.firstTry/L.total*100),perfect=acc===100;
  const est=practice?5:(10+(perfect?5:0));const sem=practice?3:5+Math.round(acc/100*5);
  const voltou=S.semanasSemJogar>=2;
  const uObj=UNITS.find(u=>u.lessons.some(l=>l.id===lesson.id));const antes=uObj?unitLessonsDone(uObj):true;
  S.estrelas+=est;markPractice();receber(sem,practice?'Treino':'Lição');
  if(!practice)S.acc[lesson.id]=acc;S.tempo[dayAbs()]=tempoHoje()+MIN_LICAO;
  agendarRevisao(lesson.id,practice);
  if(voltou){receber(10,'Boas-vindas de volta');S.semanasSemJogar=0}
  if(lesson.id.startsWith('a-'))S.areasDone[lesson.id]=true;else S.done[lesson.id]=true;
  const alcancou=uObj&&!antes&&unitLessonsDone(uObj);if(alcancou)S.estrelas+=10;
  save();$('#lesson').remove();L=null;
  const g=guideId();
  document.body.insertAdjacentHTML('beforeend',`<div class="result" id="res"><div class="r-in">${cenaResultado(g,sem+(voltou?10:0))}
    ${alcancou?`<div class="mission" style="text-align:left;width:100%"><div class="eyebrow">Objetivo alcançado ✓ · +10 Estrelas</div><b style="font-family:var(--display);font-size:18px">${OBJETIVOS[uObj.id]}</b><p style="margin:4px 0 0;color:var(--muted);font-size:14px">${S.missions[uObj.id]?'':'Agora a Missão na Vida Real está aberta: ela vale o Selo de Competência.'}</p></div>`:''}
    <h2>${voltou?'Que bom te ver de novo!':practice?'Treino feito!':'Lição concluída!'}</h2>
    <p style="margin:0;color:var(--muted)">${voltou?'Tudo o que você conquistou continua aqui. Ganhou 10 Sementes de boas-vindas.':perfect?'Sem nenhum tropeço. O que você aprendeu aqui volta nas próximas etapas.':'Errar faz parte. As que voltaram no fim já ficaram para trás.'}</p>
    <div class="tiles"><div class="tile-s" style="--tc:#2F6FD6;--tk:#fff"><small>Estrelas</small><b>+${est}</b></div>
      <div class="tile-s" style="--tc:var(--teal);--tk:#fff"><small>Precisão</small><b>${acc}%</b></div>
      <div class="tile-s" style="--tc:#2E8B57;--tk:#fff"><small>Sementes</small><b>+${sem+(voltou?10:0)}</b></div></div>
    <p style="margin:0;color:var(--muted)">As Sementes chegam no ${nomeMesada()}, quando a semana virar. Dias de prática nesta semana: ${Math.min(diasPratica(),S.ritmoMeta)} de ${S.ritmoMeta}.</p>
    <button class="btn" id="res-go" style="margin:8px auto 0;min-width:220px">Continuar</button></div></div>`);
  setTimeout(()=>burst(document.querySelector('#res .sprite'),10),750);$('#res-go').onclick=()=>{$('#res').remove();render()};
  $('#res-go').focus();
}
document.addEventListener('keydown',e=>{
  if(!L||!L.state)return;
  if(e.key==='Enter'){const go=$('#go'),chk=$('#chk');if(go){go.click();e.preventDefault()}else if(chk&&!chk.disabled){chk.click();e.preventDefault()}}
  else if(L.state.ex.type==='choice'&&!L.state.checked&&/^[1-4]$/.test(e.key)){const b=$('#ex').querySelector(`[data-i="${+e.key-1}"]`);if(b)b.click()}
});

render();sincronizarTempo();
</script>


<div id="pwa-dica" hidden style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#09274D;color:#fff;border-radius:16px;padding:14px 16px;font:500 15px/1.4 Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:520px;margin:0 auto">
  <b style="font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:17px">Instale o jogo no celular</b>
  <p id="pwa-txt" style="margin:6px 0 10px"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button id="pwa-depois" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 14px;font:inherit">Agora não</button>
    <button id="pwa-ok" hidden style="background:#FFC12E;color:#09274D;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700">Instalar</button>
  </div>
</div>
<script>
/* Versão instalável: funciona offline e guarda o progresso no app instalado */
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function(){
  const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let visto=false;try{visto=localStorage.getItem('mdc-pwa-dica')==='1'}catch(e){}
  if(inst||visto)return;
  const box=document.getElementById('pwa-dica'),txt=document.getElementById('pwa-txt'),ok=document.getElementById('pwa-ok');
  const fechar=()=>{box.hidden=true;try{localStorage.setItem('mdc-pwa-dica','1')}catch(e){}};
  document.getElementById('pwa-depois').onclick=fechar;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){txt.innerHTML='No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Assim o progresso fica guardado.';box.hidden=false;return}
  let ev=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;txt.textContent='Toque em Instalar para colocar o jogo na tela inicial. Ele abre como um app e funciona sem internet.';ok.hidden=false;box.hidden=false});
  ok.onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice.catch(()=>{});fechar()};
  setTimeout(()=>{if(!ev&&/android/i.test(navigator.userAgent)){txt.innerHTML='No Chrome, toque no menu <b>⋮</b> e depois em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';box.hidden=false}},4000);
})();
</script>
