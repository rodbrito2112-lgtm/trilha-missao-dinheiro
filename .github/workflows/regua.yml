name: Régua de retorno (lembretes)
on:
  schedule:
    - cron: '30 20,21,22 * * *'   # 17h30, 18h30 e 19h30 de Brasília
  workflow_dispatch: {}
permissions: {}
jobs:
  regua:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar lembretes do horário
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          resp=$(curl -sS -f -X POST "https://scawamgnzqrsesicqmqg.supabase.co/functions/v1/push-regua" \
            -H "x-push-token: $PUSH_TOKEN" -H "Content-Type: application/json" -d '{}')
          echo "Resposta: $resp"
